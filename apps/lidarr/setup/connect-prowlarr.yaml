schema: youeye.setup.v1
for: connect:prowlarr
steps:
  # The app's API may still be starting right after install; Prowlarr tests it when it is registered.
  - wait: { http: /ping, timeout: 180 }
  - http:
      method: DELETE
      path: /api/v1/applications/${item.id}
      target: peer
      headers:
        X-Api-Key: ${peer.api_key}
      for_each:
        path: /api/v1/applications
        where: {name: Lidarr}
  - http:
      method: POST
      path: /api/v1/applications
      target: peer
      headers:
        X-Api-Key: ${peer.api_key}
      body:
        name: Lidarr
        implementation: Lidarr
        configContract: LidarrSettings
        syncLevel: fullSync
        tags: []
        fields:
          - name: prowlarrUrl
            value: ${peer.url}
          - name: baseUrl
            value: ${self.url}
          - name: apiKey
            value: ${self.api_key}
          - name: syncCategories
            value: [3000, 3010, 3030, 3040, 3050, 3060]
      allow_failure: true
