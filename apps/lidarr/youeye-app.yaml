schema: youeye.app.v1
id: lidarr
version: 3.1.6.5079.1
name: Lidarr
# 0.6.20: an update writes the new credentials: entry into the installed record (YE-208), so updated boxes show the
# admin account too.
requires: { youeye: ">=0.6.20" }
listing:
  tagline: Your music library, automated
  description: Music collection manager for Usenet and BitTorrent
  long_description: |
    Lidarr watches for new albums from the artists you follow, finds them through your
    indexers (via Prowlarr), sends them to your download client and files them into your
    music library with tags and artwork, automatically. Quality profiles, metadata
    profiles, upgrades and failed-download handling are built in.

    Your music goes to the shared media folder (media/music), where Jellyfin can play it.

    Lidarr signs you in with its own login: user admin, with the password shown under Credentials
    on the app's page. It installs open to everyone on your home network, who see its login page.
    Change the password in Lidarr's settings (General, Security) if you like; YouEye keeps your
    change.
  release_notes: |
    Lidarr now has its own sign-in instead of YouEye's access gate: user admin, with the
    password shown under Credentials on the app's page (it is also Lidarr's API key). You
    can change it in Lidarr's settings (General, Security); YouEye keeps your change. Apps
    connected to Lidarr keep working through its API key. Your artists, settings and
    connections are kept, and settings such as the theme now also survive updates. To let
    everyone on your home network open it, turn on public access in the app's access
    settings. Same Lidarr 3.1.6.5079 (LinuxServer ls49).
  category: media
  tags: [media, music, pvr, automation, arr]
  icon: music
  icon_file: icon.svg
  screenshots:
    - path: screenshots/lidarr-artists.png
      caption: "The music library (table view)"
    - path: screenshots/lidarr-artist-details.png
      caption: "An artist's albums from the metadata server"
  website: https://lidarr.audio
  developer: Team Lidarr
  license: GPL-3.0-only
  source_code: https://github.com/Lidarr/Lidarr
  support: https://wiki.servarr.com/lidarr
  docs: https://wiki.servarr.com/lidarr
# 3.1.6.5079-ls49, multi-arch index (linux/amd64, linux/arm64)
image: docker.io/linuxserver/lidarr@sha256:8fb40ada166dd1880cb1b166df5bcbb081107523f20ab60df05c313e2052a467
port: 8686
health: /ping
# The metadata server (api.lidarr.audio) and indexers are on the internet.
internet: true
data:
  - {path: /config, kind: config}
  - {path: /custom-cont-init.d, kind: config}
shared:
  media: /data
env:
  PUID: '0'
  PGID: '0'
  TZ: Etc/UTC
secrets:
  api_key: {kind: key}
# Access: Lidarr has its own login, so it uses it and is public on the household network (owner rule 2026-11-24,
# decisions.md "YouEye ID is convenience, not a gate"; YE-204). Its account is user admin with the generated api_key
# as password (an update can't add a secret, and the key exists on every box).
# The API keeps taking the X-Api-Key header whatever the login method is (Startup.cs fallback policy, API scheme), so
# the install and connect files and Prowlarr keep working, and /ping (the health route) is [AllowAnonymous].
public_access: true
credentials:
  - {label: Admin Account, username: admin, password: api_key}
files:
  - path: /custom-cont-init.d/10-youeye-media-paths
    mode: '0700'
    template: |
      #!/usr/bin/with-contenv bash
      set -euo pipefail
      install -d -m 0775 /data/torrents /data/torrents/incomplete /data/media/music
  # Lidarr keeps its host settings in /config/config.xml and rewrites it itself (Settings, General: theme, log level,
  # instance name, login method, trusted networks), so a files: template would reset them on every update. This
  # per-start script edits only the keys YouEye owns: bind address, port, no TLS, no URL base, the API key, and a
  # login (Forms unless the household picked Forms/Basic; Enabled unless it picked DisabledForLocalAddresses).
  # It also writes <Username>admin</Username> and <Password>, which Lidarr reads only while its Users table is empty
  # (UserService.cs Handle(ApplicationStartedEvent), v3.1.6.5079) and then deletes from config.xml
  # (ConfigFileProvider.cs DeleteOldValues). So the account is created once, and a password or user the household
  # changes later is kept.
  - path: /custom-cont-init.d/20-youeye-lidarr-config
    mode: '0700'
    template: |
      #!/usr/bin/with-contenv bash
      set -euo pipefail
      f=/config/config.xml
      if [ ! -s "$f" ]; then
        printf '<Config>\n  <LaunchBrowser>False</LaunchBrowser>\n  <Branch>master</Branch>\n  <LogLevel>info</LogLevel>\n  <InstanceName>Lidarr</InstanceName>\n</Config>\n' > "$f"
      fi
      YE_KEY='${secret.api_key}' YE_PORT=8686 awk '
      function tag(line) { if (match(line, /<[A-Za-z]+/)) return substr(line, RSTART + 1, RLENGTH - 1); return "" }
      function val(line,  s) { s = line; sub(/^[^>]*>/, "", s); sub(/<.*$/, "", s); return s }
      function put(n, v) { print "  <" n ">" v "</" n ">" }
      BEGIN {
        k = ENVIRON["YE_KEY"]
        force["BindAddress"] = "*"; force["Port"] = ENVIRON["YE_PORT"]; force["EnableSsl"] = "False"
        force["UrlBase"] = ""; force["ApiKey"] = k
      }
      /<\/Config>/ {
        for (n in force) if (!(n in seen)) put(n, force[n])
        if (!("AuthenticationMethod" in seen)) put("AuthenticationMethod", "Forms")
        if (!("AuthenticationRequired" in seen)) put("AuthenticationRequired", "Enabled")
        put("Username", "admin"); put("Password", k)
        print; next
      }
      { t = tag($0) }
      t == "Username" || t == "Password" { next }
      t in force { seen[t] = 1; put(t, force[t]); next }
      t == "AuthenticationMethod" {
        seen[t] = 1; v = val($0); l = tolower(v)
        put(t, (l == "forms" || l == "basic") ? v : "Forms"); next
      }
      t == "AuthenticationRequired" {
        seen[t] = 1; v = val($0); l = tolower(v)
        put(t, (l == "enabled" || l == "disabledforlocaladdresses") ? v : "Enabled"); next
      }
      { print }
      ' "$f" > "$f.youeye"
      grep -q '<ApiKey>' "$f.youeye"
      grep -q '</Config>' "$f.youeye"
      cat "$f.youeye" > "$f"
      rm -f "$f.youeye"
      chmod 0600 "$f"
provides:
  - {type: pvr, description: Music PVR (Lidarr), port: 8686, scope: service}
connects:
  - app: prowlarr
    name: Prowlarr
    description: Manage indexers for Lidarr in Prowlarr
    scope: service
    setup: setup/connect-prowlarr.yaml
  - app: qbittorrent
    name: qBittorrent
    description: Send music downloads to qBittorrent
    scope: service
    setup: setup/connect-qbittorrent.yaml
# How connected apps read this app's API key (${peer.api_key} in their connect setup).
api_key: {secret: api_key}
