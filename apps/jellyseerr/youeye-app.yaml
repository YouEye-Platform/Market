schema: youeye.app.v1
id: jellyseerr
version: 3.5.2
name: Seerr
listing:
  tagline: Let your users request the media they want
  description: Media request and discovery manager for Jellyfin, Plex, and Emby
  long_description: |
    Seerr is the maintained successor to Jellyseerr and Overseerr: a free, open-source
    request-management and media-discovery tool for Jellyfin, Plex, and Emby. Users browse
    movies and TV shows, request what they want to watch, and Seerr hands approved requests
    to Sonarr or Radarr. Administrators get approval workflows, granular permissions,
    quotas, availability scans, and one place to manage every request.
  release_notes: |
    Seerr 3.5.2 is a security release. It fixes a path traversal in the image proxy
    that could lead to remote code execution (CVE-2026-73291, fixed in 3.4.0) and several
    later advisories (data leaks, a permission escalation between managers and admins,
    and a password change that skipped the current password). Jellyfin and Emby users
    can now sign in with Quick Connect, so household members who only have a YouEye ID
    Jellyfin account can use Seerr without a Jellyfin password.
  category: media
  tags: [media, requests, discovery, jellyfin, plex, emby, arr]
  icon: popcorn
  icon_file: icon.svg
  screenshots:
    - path: screenshots/seerr-preview.jpg
      caption: "Discover page with recently added, requests and trending titles"
    - path: screenshots/settings-metadata-providers.png
      caption: "Settings: metadata providers (admin)"
  website: https://seerr.dev
  developer: Seerr Team & contributors
  license: MIT
  source_code: https://github.com/seerr-team/seerr
  support: https://github.com/seerr-team/seerr/discussions
  docs: https://docs.seerr.dev
# v3.5.2, multi-arch index (amd64, arm64)
image: ghcr.io/seerr-team/seerr@sha256:aadee014b40e28cf9aa4928bc9d1183a6eb08f8c44d543cddc9efdcb16549be2
port: 5055
health: /api/v1/settings/public
internet: true
data:
  - /app/config
env:
  LOG_LEVEL: info
  # The platform's scoped service-network helper configures split DNS with
  # resolvectl after DHCP. Alpine uses udhcpc without systemd-resolved, so put
  # the compatibility shim below ahead of the image PATH.
  PATH: /app/config/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  PORT: '5055'
  TZ: Etc/UTC
files:
  - path: /app/config/bin/resolvectl
    mode: '0755'
    dir_mode: '0755'
    template: |
      #!/bin/sh
      # Alpine's udhcpc already updates the container resolver. This command
      # exists only so YouEye's systemd-resolved integration hook is portable.
      exit 0
connects:
  - app: jellyfin
    name: Jellyfin
    description: Sync libraries and users from Jellyfin
    scope: service
  - app: sonarr
    name: Sonarr
    description: Send TV requests to Sonarr
    scope: service
  - app: radarr
    name: Radarr
    description: Send movie requests to Radarr
    scope: service
