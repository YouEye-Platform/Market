schema: youeye.app.v1
id: actual-budget
version: 26.11.0
name: Actual Budget
listing:
  tagline: A private, local-first envelope budget for every device
  description: Privacy-focused envelope budgeting with bank sync
  long_description: |
    Actual Budget is a super fast, privacy-focused app for managing your finances. Uses
    envelope-style budgeting to help you track spending, plan ahead, and stay on top of
    your money. Features include bank sync, powerful reports, custom rules, and a responsive
    interface.

    Sign-in: the first person who signs in with YouEye ID becomes the owner (admin) of this budget server;
    Actual cannot take roles from YouEye ID. A new app is open only to you until you share it, so sign in
    once yourself before sharing it. Further admins are set in Actual's User Directory.
  release_notes: |
    Actual 26.11.0 brings three monthly releases of fixes and improvements to budgeting,
    reports and bank sync. The server now runs on Node 24, can read its secrets from
    files, and only lets a SimpleFIN bridge on a private network through when the server
    allows it.
  category: productivity
  tags: [budget, finance, money, personal-finance]
  icon: wallet
  icon_file: icon.svg
  screenshots:
    - path: screenshots/budget-overview-demo.png
      caption: "Monthly budget with categories and what is left to spend"
    - path: screenshots/reports-light.png
      caption: "Reports: net worth over time and a spending calendar"
  website: https://actualbudget.org
  developer: Actual Budget contributors
  license: MIT
  source_code: https://github.com/actualbudget/actual
  support: https://github.com/actualbudget/actual/issues
  docs: https://actualbudget.org/docs/
# 26.11.0, multi-arch index (linux/amd64, linux/arm64)
image: docker.io/actualbudget/actual-server@sha256:06cf186569cf58d93e12659ff1a517b65b5b0ebee7050a3991d4bd8a1d398da6
port: 5006
health: /
internet: true
data:
  - /data
# Actual Budget reads OIDC purely from env. The FIRST user to sign in through the
# identity provider becomes the server owner/admin; Actual does NOT read group or
# role claims, so additional admins are assigned manually in its User Directory.
env:
  ACTUAL_USER_CREATION_MODE: login
sso:
  callback: /openid/callback
  env:
    ACTUAL_OPENID_DISCOVERY_URL: ${sso.discovery_url}
    ACTUAL_OPENID_CLIENT_ID: ${sso.client_id}
    ACTUAL_OPENID_CLIENT_SECRET: ${sso.client_secret}
    ACTUAL_OPENID_SERVER_HOSTNAME: ${app.url}
    ACTUAL_OPENID_AUTH_METHOD: openid
