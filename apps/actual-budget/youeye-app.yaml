apiVersion: v1
kind: app
integration: basic
version: "26.8.1"

metadata:
  id: "actual-budget"
  name: "Actual Budget"
  description: "Privacy-focused envelope budgeting with bank sync"
  icon: "wallet"
  iconUrl: "icon.svg"
  category: "productivity"
  website: "https://actualbudget.org"
  developer: "Actual Budget contributors"
  license: "MIT"
  sourceCode: "https://github.com/actualbudget/actual"
  support: "https://github.com/actualbudget/actual/issues"
  docs: "https://actualbudget.org/docs/"
  tagline: "A private, local-first envelope budget for every device"
  tags: ["budget", "finance", "money", "personal-finance"]
  defaultSubdomain: "budget"

detail:
  releaseNotes: |
    Actual Budget 26.8.1 is the current hotfix release. It resolves performance
    regressions reported in 26.8.0 and includes additional reliability fixes
    across the server and responsive budgeting client.
  longDescription: |
    Actual Budget is a super fast, privacy-focused app for managing your finances. Uses
    envelope-style budgeting to help you track spending, plan ahead, and stay on top of
    your money. Features include bank sync, powerful reports, custom rules, and a responsive
    interface.
  screenshots:
    - path: "screenshots/platform-admin-budget.png"
      caption: "Platform administrator creating and reviewing an envelope budget"
    - path: "screenshots/standard-user-budget.png"
      caption: "Standard user working in an independently isolated budget file"

database:
  mode: none

containers:
  - name: "main"
    type: oci
    primary: true
    image: "docker.io/actualbudget/actual-server@sha256:6478d9ddfc0924479c09e6699c205e354c6f2216dfe7de3c0fb7b590d6edcdc5"
    port: 5006
    network: internet
    volumes:
      - name: data
        container: "/data"
        type: data
    healthCheck:
      type: "http"
      path: "/"
      timeout: 120000

sso:
  type: oauth2
  callback_path: /openid/callback
  setup:
    method: env
  redirectUris:
    - url: "${install.url}/openid/callback"

# Actual Budget reads OIDC purely from env. The FIRST user to sign in through the
# identity provider becomes the server owner/admin; Actual does NOT read group or
# role claims, so additional admins are assigned manually in its User Directory.
env_mapping:
  ACTUAL_OPENID_DISCOVERY_URL: "${sso.discovery_url}"
  ACTUAL_OPENID_CLIENT_ID: "${sso.client_id}"
  ACTUAL_OPENID_CLIENT_SECRET: "${sso.client_secret}"
  ACTUAL_OPENID_SERVER_HOSTNAME: "${app.url}"
  ACTUAL_OPENID_AUTH_METHOD: "openid"
  ACTUAL_USER_CREATION_MODE: "login"
