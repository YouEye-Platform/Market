schema: youeye.app.v1
id: memos
version: 26.11.1
name: Memos
listing:
  tagline: Capture ideas quickly in a private Markdown-first notebook
  description: Lightweight self-hosted memo hub
  long_description: |
    A privacy-first, lightweight note-taking service. Easily capture and share your great thoughts.
    Built with Go and React.

    Sign-in: everyone signs in with YouEye ID and is a regular Memos user; Memos cannot take roles from
    YouEye ID. The Memos admin is the setup account shown under Credentials; use it to promote others.
  release_notes: |
    Memos 26.11.1 is a new major line (calendar versions): a faster editor and timeline,
    per-memo usage limits, a new attachment index and many fixes. RSS feeds and member
    export were removed upstream. Installed Memos 0.30 cannot update in place (Memos
    requires a 0.31 step first): remove Memos with its data and install it again. Everyone
    signs in again after the change.
  category: productivity
  tags: [notes, memo, markdown]
  icon: sticky-note
  icon_file: icon.svg
  screenshots:
    - path: screenshots/timeline-light.png
      caption: "Memo timeline with calendar, tags and the editor"
    - path: screenshots/timeline-dark.png
      caption: "The same timeline in the dark theme"
  website: https://usememos.com
  developer: Memos contributors
  license: MIT
  source_code: https://github.com/usememos/memos
  support: https://github.com/usememos/memos/issues
  docs: https://www.usememos.com/docs
# 26.11.1, multi-arch index (linux/amd64, linux/arm, linux/arm64)
image: docker.io/neosmemo/memos@sha256:5dcd6e6b973a55b964f2fe2ccdaa33319463ab448a23404ebb5d2acbd19299ba
port: 5230
health: /healthz
internet: true
database: postgres
data:
  - /var/opt/memos
env:
  MEMOS_DRIVER: postgres
  MEMOS_DSN: ${database.url}?sslmode=disable
  MEMOS_INSTANCE_URL: ${app.url}
secrets:
  admin_password: {length: 24}
credentials:
  - {label: Admin Account, username: admin, password: admin_password}
sso:
  callback: /auth/callback
surfaces:
  - id: memo-alert
    kind: notification
    placement: notification-center
    name: Memos notification
    description: Render a Memos notification embed inside YouEye notifications.
    embed: /embed/notification/memo-alert
    permissions: ['notifications:send']
