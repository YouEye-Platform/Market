schema: youeye.app.v1
id: memos
version: 26.11.2
name: Memos
listing:
  # Tagline, description and the first three paragraphs are upstream's copy, used as written
  # (usememos/.github BRAND.md "Copy": headline, description, full introduction).
  tagline: Simple note-taking for your everyday thoughts.
  description: Memos is an open-source, self-hosted note-taking app that brings your everyday thoughts together in a personal timeline. Your data stays yours, and you choose what to keep private or share.
  long_description: |
    Memos is an open-source, self-hosted note-taking app for your everyday thoughts. It’s a place to write
    what’s on your mind as you go about your day. A single sentence can be a whole memo, or you can take your
    time with a longer entry, using Markdown to give your words more structure.

    These moments of writing gradually become a personal record. Each memo stays with the day you wrote it,
    bringing your thoughts together in a timeline you can look back through. Tags connect related thoughts
    across those days, making it easy to pick up a topic again or find something you remember writing.

    That record lives on your own server, and your data stays yours. You choose what stays private, what to
    share with family and friends, and what to publish on the web. In shared spaces, you can write alongside
    others while each person keeps their own memos.

    Sign-in: everyone signs in with YouEye ID and is a regular Memos user; Memos cannot take roles from
    YouEye ID. The Memos admin is the setup account shown under Credentials; use it to promote others.

    Memos has its own sign-in (YouEye ID, or the admin password YouEye generates), so it installs with public
    access: anyone on your network can reach it, and memo apps and plugins with an access token work, and shared
    memos open for others. To keep it to people with a YouEye account instead, turn public access off in the
    install dialog or later in the app's access settings.
  release_notes: |
    Memos 26.11.2 is a fix release: comments are now memos of their own (the timeline can include
    them), compact mode moved to Settings > Preferences, and the timeline can use the full width.
    No data changes. Installed Memos 0.30 still cannot update in place (Memos requires a 0.31
    step first): remove Memos with its data and install it again.

    New installs are reachable by anyone on your network, because the app has its own sign-in; on an installed
    copy, turn on public access in the app's access settings if you want that.
  category: productivity
  tags: [notes, memo, markdown]
  icon: sticky-note
  icon_file: icon.svg
  screenshots:
    - path: screenshots/timeline-light.png
      caption: "Memo timeline with calendar, tags and the editor"
    - path: screenshots/timeline-dark.png
      caption: "The same timeline in the dark theme"
  website: https://usememos.com
  developer: Memos contributors
  license: MIT
  source_code: https://github.com/usememos/memos
  support: https://github.com/usememos/memos/issues
  docs: https://www.usememos.com/docs
# 26.11.2, multi-arch index (linux/amd64, linux/arm, linux/arm64)
image: docker.io/neosmemo/memos@sha256:3c7bd779510403350465ecabb7e6fbc0887206f9d55b8decf51a205613fa5616
port: 5230
health: /healthz
internet: true
database: postgres
data:
  - /var/opt/memos
env:
  MEMOS_DRIVER: postgres
  MEMOS_DSN: ${database.url}?sslmode=disable
  MEMOS_INSTANCE_URL: ${app.url}
secrets:
  admin_password: {length: 24}
# Access: Memos has its own sign-in, so it installs with public access: anyone on the household network (LAN/VPN)
# can reach it, protected by the app (owner rules 2026-11-13 and 2026-11-24, decisions.md "YouEye lives on the
# LAN; apps behave like upstream"; YE-153). YouEye ID still refuses tokens to people without access to the app.
public_access: true
credentials:
  - {label: Admin Account, username: admin, password: admin_password}
sso:
  callback: /auth/callback
