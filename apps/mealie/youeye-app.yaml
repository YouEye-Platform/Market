schema: youeye.app.v1
id: mealie
version: 3.31.0
name: Mealie
listing:
  tagline: Recipes, meal plans, and shopping lists in one place
  description: Recipe manager and meal planner with automatic import
  long_description: |
    Mealie is a self-hosted recipe manager and meal planner. Automatically import recipes
    from any URL, organize by category and tag, plan weekly meals with a drag-and-drop
    calendar, and generate shopping lists. Features include nutritional info, multi-user
    support, recipe sharing, and a mobile-friendly interface.

    Mealie has its own sign-in (YouEye ID), so it installs with public access: anyone on your network can reach
    it, and Mealie's phone apps, shared recipe links and API tokens (for example Home Assistant) work. To keep
    it to people with a YouEye account instead, turn public access off in the install dialog or later in the
    app's access settings.
  release_notes: |
    Mealie 3.31.0 brings nine releases: recipe PDF export, OIDC avatars, faster search,
    security fixes, and a guard that keeps recipe imports, images and webhooks from
    reaching private network addresses (sign-in with YouEye ID is not affected). It also
    closes a gap in YouEye's Mealie setup: the admin account Mealie creates by itself kept
    Mealie's built-in default password; it now gets a random password nobody knows.
    Admins are still the members of YouEye ID's admin group.

    New installs are reachable by anyone on your network, because the app has its own sign-in; on an installed
    copy, turn on public access in the app's access settings if you want that.
  category: productivity
  tags: [recipes, cooking, meal-planning, food]
  icon: utensils
  icon_file: icon.svg
  screenshots:
    - path: screenshots/recipe-page.webp
      caption: "Recipe with ingredients and steps"
    - path: screenshots/meal-planner.webp
      caption: "Meal planner for the week"
  website: https://mealie.io
  developer: Mealie contributors
  license: AGPL-3.0
  source_code: https://github.com/mealie-recipes/mealie
  support: https://github.com/mealie-recipes/mealie/discussions
  docs: https://docs.mealie.io/
# v3.31.0, multi-arch index (linux/amd64, linux/arm64)
image: ghcr.io/mealie-recipes/mealie@sha256:97e21ac96e9a8d1ee15aaf558ba3f14998936b9d6f334e40ebb4c6c2127dc12f
port: 9000
health: /api/app/about
internet: true
data:
  - /app/data
env:
  BASE_URL: ${app.url}
  TZ: ${platform.timezone}
# Mealie seeds an admin `changeme@example.com` on first start with its built-in default password (DEFAULT_PASSWORD
# is ignored since 3.x), and POST /api/auth/token accepts it even with ALLOW_PASSWORD_LOGIN=false (that switch only
# hides the form). Confirmed on 3.22.0 (Plan 1, 2026-11-17). The script below runs next to Mealie at every start
# (so updates fix existing installs too): once the user exists and still has the default password, it gets a random
# password nobody knows. Admins come from YouEye ID's admin group (sso.env).
command: [/bin/sh, -c, 'cd /app && (python3 /app/data/youeye-lock-seeded-admin.py &) ; exec /app/run.sh']
secrets:
  # Unused since 3.31.0 (was DEFAULT_PASSWORD, which Mealie ignores); kept so installed apps keep their secret set.
  admin_password: {length: 24}
# Access: Mealie has its own sign-in, so it installs with public access: anyone on the household network (LAN/VPN)
# can reach it, protected by the app (owner rules 2026-11-13 and 2026-11-24, decisions.md "YouEye lives on the
# LAN; apps behave like upstream"; YE-153). YouEye ID still refuses tokens to people without access to the app.
public_access: true
files:
  - path: /app/data/youeye-lock-seeded-admin.py
    mode: '0600'
    template: |
      # YouEye: give Mealie's seeded admin an unusable password if it still has Mealie's built-in default.
      import os, secrets, sqlite3, time
      DB = '/app/data/mealie.db'
      Q = "select id, password from users where email = 'changeme@example.com' and auth_method = 'MEALIE'"
      rows = []
      for _ in range(900):
          try:
              if os.path.exists(DB):
                  rows = sqlite3.connect(DB).execute(Q).fetchall()
                  if rows:
                      break
          except sqlite3.Error:
              pass
          time.sleep(2)
      if rows:
          from mealie.core.security.hasher import get_hasher
          hasher = get_hasher()
          db = sqlite3.connect(DB)
          for uid, pw in rows:
              if hasher.verify('MyPassword', pw):
                  db.execute('update users set password = ? where id = ?', (hasher.hash(secrets.token_urlsafe(48)), uid))
                  db.commit()
                  print('youeye: seeded admin changeme@example.com now has a random password', flush=True)
sso:
  callback: /login
  env:
    OIDC_AUTH_ENABLED: 'true'
    OIDC_SIGNUP_ENABLED: 'true'
    # Split-channel: discovery over the INTERNAL identity DNAT (${sso.discovery_url} =
    # http://<app-gw>:3002/...), so it works under full network isolation. The discovery
    # doc returns the matching internal issuer + EXTERNAL authorize endpoint for the browser.
    OIDC_CONFIGURATION_URL: ${sso.discovery_url}
    OIDC_CLIENT_ID: ${sso.client_id}
    OIDC_CLIENT_SECRET: ${sso.client_secret}
    OIDC_AUTO_REDIRECT: 'false'
    OIDC_PROVIDER_NAME: ${identity.name}
    OIDC_USER_CLAIM: preferred_username
    OIDC_GROUPS_CLAIM: groups
    OIDC_ADMIN_GROUP: admin
    # YouEye ID only: no password form. Recovery: set ALLOW_PASSWORD_LOGIN=true on the container.
    ALLOW_PASSWORD_LOGIN: 'false'
smtp:
  env:
    SMTP_HOST: ${smtp.host}
    SMTP_PORT: ${smtp.port}
    SMTP_FROM_NAME: ${platform.site_name}
    SMTP_FROM_EMAIL: ${smtp.from}
    SMTP_USER: ${smtp.user}
    SMTP_PASSWORD: ${smtp.password}
    SMTP_AUTH_STRATEGY: TLS
