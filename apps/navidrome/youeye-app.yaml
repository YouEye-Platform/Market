schema: youeye.app.v1
id: navidrome
version: 0.64.2
name: Navidrome
listing:
  tagline: Your music, your server, everywhere
  description: Personal music streaming server with Subsonic API
  long_description: |
    Navidrome is an open-source music server and streamer. Stream your entire music collection
    from anywhere using any Subsonic-compatible client. Features include multi-user support,
    smart playlists, album art, lyrics, and fast transcoding. Works with DSub, Symfonium,
    play:Sub, and many more clients for your personal library.
  release_notes: |
    Navidrome 0.64.2 improves scanning on slow storage, fixes initial administrator
    creation and download filename handling, and includes the 0.64.1 security
    fixes for authentication and per-library access. Existing databases must be
    backed up before upgrading across 0.64 because internal IDs are re-encoded.
  category: media
  tags: [music, streaming, subsonic, audio]
  icon: music
  icon_file: icon.svg
  screenshots:
    - path: screenshots/platform-admin-library-0.63.2.png
      caption: Historical 0.63.2 player layout, cropped; see ASSET-NOTICES.md
    - path: screenshots/standard-user-player-0.63.2.png
      caption: Historical 0.63.2 song table, cropped; see ASSET-NOTICES.md
  website: https://www.navidrome.org
  developer: Navidrome project and contributors
  license: GPL-3.0
  source_code: https://github.com/navidrome/navidrome
  support: https://github.com/navidrome/navidrome/discussions
  docs: https://www.navidrome.org/docs/
image: docker.io/navidrome/navidrome@sha256:59ce76e6e06193fbfbb1736a93b8468227e1ea663fc7b25b1da13fbb97f5197b
port: 4533
health: /ping
internet: true
data:
  - /data
  - {path: /music, kind: media}
# Navidrome has no native OIDC. The platform forward-auth handler removes untrusted
# identity headers and injects X-YouEye-Username after authentication; Navidrome's
# current ExtAuth contract trusts only the platform proxy network. The first user to
# arrive becomes the Navidrome administrator, and subsequent users are regular users.
env:
  ND_BASEURL: ''
  ND_DATAFOLDER: /data
  ND_MUSICFOLDER: /music
  ND_DEFAULTLANGUAGE: ${platform.locale}
  ND_EXTAUTH_USERHEADER: X-YouEye-Username
  ND_EXTAUTH_TRUSTEDSOURCES: 10.76.0.0/16
  # Public share URLs cannot bypass YouEye forward-auth in this integration.
  ND_ENABLESHARING: 'false'
