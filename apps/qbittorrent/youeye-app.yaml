schema: youeye.app.v1
id: qbittorrent
version: 5.3.0.488
name: qBittorrent
listing:
  tagline: A fast, lightweight BitTorrent client
  description: Free and open-source BitTorrent client
  long_description: |
    qBittorrent is a free, open-source BitTorrent client with no ads. It ships a built-in
    search engine, RSS downloading, bandwidth scheduling, and a polished web UI. As the
    download client for the *arr stack it receives grabs from Sonarr and Radarr and saves
    them into shared storage, so your media apps can import finished downloads with instant
    hardlinks. YouEye generates the first WebUI administrator password and writes
    only qBittorrent's supported salted PBKDF2 hash before the service starts.
  release_notes: |
    qBittorrent 5.3.0 with libtorrent 2.1.2 in a fresh LinuxServer build (ls488) with
    updated system packages. Settings, downloads and shared media paths are kept. The
    WebUI uses one shared generated credential.
  category: downloaders
  tags: [downloader, torrent, bittorrent, arr]
  icon: download
  icon_file: icon.svg
  screenshots:
    - path: screenshots/qbittorrent-webui-login.png
      caption: "qBittorrent web interface sign-in (its own password, shown under Credentials)"
    - path: screenshots/sonarr-download-clients.png
      caption: "Sonarr sending downloads to qBittorrent once the connection is approved"
  website: https://www.qbittorrent.org
  developer: The qBittorrent project
  license: GPL-3.0-or-later
  source_code: https://github.com/qbittorrent/qBittorrent
  support: https://github.com/qbittorrent/qBittorrent/wiki
  docs: https://github.com/qbittorrent/qBittorrent/wiki
# 5.3.0_v2.1.2-ls488, multi-arch index (linux/amd64, linux/arm64)
image: docker.io/linuxserver/qbittorrent@sha256:afed7399d0f336ee22d6d011b3c8c50a44e3810f0af6e3c4083d79e566f1677a
port: 8080
health: /
internet: true
data:
  - {path: /config, kind: config}
  - {path: /custom-cont-init.d, kind: config}
shared:
  media: /data
env:
  PUID: '0'
  PGID: '0'
  TZ: Etc/UTC
  WEBUI_PORT: '8080'
  TORRENTING_PORT: '6881'
  YOUEYE_QBITTORRENT_PASSWORD: ${secret.admin_password}
  YOUEYE_QBITTORRENT_URL: ${app.url}
secrets:
  admin_password: {length: 24}
credentials:
  - {label: WebUI Administrator, username: admin, password: admin_password}
files:
  - path: /custom-cont-init.d/10-youeye-webui-credential
    mode: '0700'
    template: |
      #!/usr/bin/with-contenv bash
      set -euo pipefail

      python3 - <<'PY'
      import base64
      import hashlib
      import os
      from pathlib import Path
      import re
      import secrets
      from urllib.parse import urlparse

      config_dir = Path("/config/qBittorrent")
      config_path = config_dir / "qBittorrent.conf"
      marker_path = config_dir / ".youeye-credential-ready"
      password = os.environ["YOUEYE_QBITTORRENT_PASSWORD"]
      hostname = urlparse(os.environ["YOUEYE_QBITTORRENT_URL"]).hostname

      if len(password) < 6:
          raise RuntimeError("generated qBittorrent password is too short")
      if not hostname:
          raise RuntimeError("qBittorrent public hostname is unavailable")

      if not marker_path.exists():
          salt = secrets.token_bytes(16)
          key = hashlib.pbkdf2_hmac("sha512", password.encode(), salt, 100000, 64)
          encoded = f"{base64.b64encode(salt).decode()}:{base64.b64encode(key).decode()}"
          lines = [
              "[AutoRun]",
              "enabled=false",
              "program=",
              "",
              "[LegalNotice]",
              "Accepted=true",
              "",
              "[Preferences]",
              r"Connection\UPnP=false",
              r"Connection\PortRangeMin=6881",
              r"Downloads\SavePath=/data/torrents/",
              r"Downloads\TempPath=/data/torrents/incomplete/",
              r"Downloads\TempPathEnabled=true",
              r"Session\DefaultSavePath=/data/torrents/",
              r"Session\TempPath=/data/torrents/incomplete/",
              r"Session\TempPathEnabled=true",
              r"WebUI\Address=*",
              r"WebUI\LocalHostAuth=true",
              f'WebUI\\Password_PBKDF2="@ByteArray({encoded})"',
              r"WebUI\Port=8080",
              f"WebUI\\ServerDomains={hostname}",
              r"WebUI\Username=admin",
              "",
          ]
          config_dir.mkdir(mode=0o700, parents=True, exist_ok=True)
          temporary = config_path.with_suffix(".tmp")
          temporary.write_text("\n".join(lines))
          temporary.chmod(0o600)
          temporary.replace(config_path)
          marker_path.write_text("ready\n")
          marker_path.chmod(0o600)

      # On every start: the WebUI answers only for its current address (host header check), and the
      # address in YOUEYE_QBITTORRENT_URL changes when the box's address does.
      # qBittorrent 5 moves the WebUI settings from [Preferences] (WebUI\ServerDomains=) into its own [WebUI]
      # section (ServerDomains=) on first start, and reads only that one; both forms are kept current.
      text = config_path.read_text()
      lines = text.split("\n")
      section, webui_at, prefs_at, webui_set, prefs_set = None, None, None, False, False
      for index, entry in enumerate(lines):
          if re.match(r"^\[.*\]$", entry):
              section = entry
              webui_at = index if entry == "[WebUI]" else webui_at
              prefs_at = index if entry == "[Preferences]" else prefs_at
          elif section == "[WebUI]" and entry.startswith("ServerDomains="):
              lines[index], webui_set = f"ServerDomains={hostname}", True
          elif section == "[Preferences]" and entry.startswith("WebUI\\ServerDomains="):
              lines[index], prefs_set = f"WebUI\\ServerDomains={hostname}", True
      if webui_at is not None:
          if not webui_set:
              lines.insert(webui_at + 1, f"ServerDomains={hostname}")
      elif not prefs_set:
          if prefs_at is not None:
              lines.insert(prefs_at + 1, f"WebUI\\ServerDomains={hostname}")
          else:
              lines += ["", "[Preferences]", f"WebUI\\ServerDomains={hostname}"]
      updated = "\n".join(lines)
      if updated != text:
          temporary = config_path.with_suffix(".tmp")
          temporary.write_text(updated)
          temporary.chmod(0o600)
          temporary.replace(config_path)

      for path in (
          Path("/data/torrents"),
          Path("/data/torrents/incomplete"),
          Path("/data/media/tv"),
          Path("/data/media/movies"),
      ):
          path.mkdir(mode=0o775, parents=True, exist_ok=True)
      PY
provides:
  - {type: download-client, description: BitTorrent download client (qBittorrent), port: 8080, scope: service}
# Connected apps (Sonarr, Radarr) sign in to the WebUI with this (${peer.api_key} in their connect setup).
api_key: {secret: admin_password}
