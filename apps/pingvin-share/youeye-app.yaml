schema: youeye.app.v1
id: pingvin-share
version: 2.1.1
name: Pingvin Share X
listing:
  tagline: Secure, expiring file transfers from your own server
  description: Lightweight file sharing with expiring links
  long_description: |
    Pingvin Share X is a self-hosted file sharing platform. Create shareable links with
    password protection, expiration dates, and visitor limits. Features include drag-and-drop
    upload, QR code sharing, email notifications, and a clean mobile-friendly interface.

    Pingvin Share X has its own sign-in (its own accounts, and the admin password YouEye generates), so it
    installs with public access: anyone on your network can reach it, and anyone you send a share link or an
    upload link to can open it. To keep it to people with a YouEye account instead, turn public access off in
    the install dialog or later in the app's access settings.
  release_notes: |
    Pingvin Share X 2.1.1 is a new major version: per-user quotas and permissions, a
    password policy, a reorganised configuration menu, security fixes and Next.js 15.
    Shares and accounts are kept.

    New installs are reachable by anyone on your network, because the app has its own sign-in; on an installed
    copy, turn on public access in the app's access settings if you want that.
  category: utilities
  tags: [files, sharing, upload, transfer]
  icon: share-2
  icon_file: icon.svg
  screenshots:
    - path: screenshots/upload-page.png
      caption: "Upload page for a new share"
    - path: screenshots/pingvin-share-sign-in.png
      caption: "Sign-in page (Pingvin Share keeps its own accounts)"
  website: https://smp46.github.io/pingvin-share-x/
  developer: Pingvin Share X contributors
  license: BSD-2-Clause
  source_code: https://github.com/smp46/pingvin-share-x
  support: https://github.com/smp46/pingvin-share-x/issues
  docs: https://smp46.github.io/pingvin-share-x/
# v2.1.1, multi-arch index (linux/amd64, linux/arm64)
image: docker.io/smp46/pingvin-share-x@sha256:7b3a70a6f016eb63dab0b7bda8431373fc8b0c5120a58d9572cb5ffdae241739
port: 3000
health: /api/health
command:
  - /bin/sh
  - -lc
  - chown 100:1000 /opt/app/config/config.yaml && exec sh /opt/app/scripts/docker/create-user.sh sh /opt/app/scripts/docker/entrypoint.sh
internet: true
data:
  - /opt/app/backend/data
  - /opt/app/frontend/public/img
  - {path: /opt/app/config, kind: config}
env:
  CONFIG_FILE: /opt/app/config/config.yaml
  # Prisma resolves this path relative to backend/prisma/schema.prisma.
  DATABASE_URL: file:../data/pingvin-share.db?connection_limit=1
  TRUST_PROXY: 'true'
  # The upstream entrypoint's Alpine adduser invocation prompts for a password
  # when an unmapped UID is used. Reuse the image's non-root caddy account so
  # Incus startup remains non-interactive while the app keeps a dedicated GID.
  PUID: '100'
  PGID: '1000'
secrets:
  admin_password: {length: 24}
# Access: Pingvin Share X has its own sign-in, so it installs with public access: anyone on the household network
# (LAN/VPN) can reach it, protected by the app (owner rules 2026-11-13 and 2026-11-24, decisions.md "YouEye lives
# on the LAN; apps behave like upstream"; YE-153). YouEye ID still refuses tokens to people without access to the
# app.
public_access: true
credentials:
  - {label: Admin Account, username: admin@example.invalid, password: admin_password}
files:
  - path: /opt/app/config/config.yaml
    mode: '0600'
    template: |
      general:
        appName: "Pingvin Share X"
        appUrl: "${app.url}"
      # 2.x keys (1.x had general.secureCookies and share.allowRegistration; 2.x still maps those, with a warning).
      # Sign-up stays open as upstream ships it: with public access, anyone on the household network (LAN/VPN) can
      # make an account (owner, 2026-11-24, decisions.md "YouEye lives on the LAN; apps behave like upstream").
      security:
        secureCookies: "true"
        allowRegistration: "true"
      initUser:
        enabled: true
        username: "admin"
        email: "admin@example.invalid"
        password: "${secret.admin_password}"
        isAdmin: true
        ldapDN: ""
