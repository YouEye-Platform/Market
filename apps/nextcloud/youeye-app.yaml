schema: youeye.app.v1
id: nextcloud
version: 35.0.3.4
requires: { youeye: ">=0.6.15" }
name: Nextcloud
listing:
  tagline: Your files, contacts and calendars at home
  description: Cloud storage, collaboration, and file sharing
  long_description: |
    Nextcloud is a safe home for all your data: store and sync your files, contacts, calendars and
    more on your own server. YouEye installs Nextcloud Server with its built-in apps (Files, Photos,
    Activity, Dashboard and sharing), and phones and computers sync contacts and calendars with it
    over CardDAV and CalDAV. Calendar, Contacts, Mail, Talk and hundreds of community apps are
    Nextcloud apps you add from its app store (Apps, in an admin's account menu).

    Office documents: install ONLYOFFICE Docs from the Market and approve its connection to Nextcloud;
    YouEye sets up Nextcloud's ONLYOFFICE app, and Word, Excel and PowerPoint files open in the editor
    (approving it replaces ONLYOFFICE settings made by hand in Nextcloud).

    Nextcloud has its own sign-in (YouEye ID; the desktop and phone apps use app passwords; the
    local admin, password under the app's credentials, at /login?direct=1), so it installs with
    public access: anyone on your network can reach it, and the Nextcloud desktop and phone apps,
    calendar and contact sync (CalDAV, CardDAV) and WebDAV work. To keep it to people with a
    YouEye account instead, turn public access off in the install dialog or later in the app's
    access settings; Nextcloud's own apps then can't connect.
  release_notes: |
    Nextcloud can now connect to ONLYOFFICE Docs from the Market: approve the connection and
    office documents open and save in the editor. Nothing changes until you approve it. Since
    35.0.3.3, Nextcloud's own setup checks are clean (maintenance window at 01:00 UTC, database
    indices, HSTS), and background jobs run every 5 minutes on their own. No database migration.
  category: productivity
  tags: [cloud, storage, files, collaboration, office]
  icon: cloud
  icon_file: icon.svg
  screenshots:
    - path: screenshots/files-details-hub26.png
      caption: "Files with the sharing sidebar"
    - path: screenshots/hub-25-files.png
      caption: "Files on desktop and phone"
  website: https://nextcloud.com
  developer: Nextcloud GmbH
  license: AGPL-3.0
  source_code: https://github.com/nextcloud/server
  support: https://help.nextcloud.com
  docs: https://docs.nextcloud.com
# 35.0.3-apache (rebuild of 2026-11, PHP 8.5.13), multi-arch index (linux/386, linux/amd64, linux/arm, linux/arm64, linux/ppc64le, linux/s390x)
image: docker.io/library/nextcloud@sha256:f22d1dd63844bd15bbf6c2019149653c3d1c775ba48b173b56c3c6ad5f386196
port: 80
# At every start (exec'd, so Apache gets SIGTERM on stop; `incus stop` takes ~1 s):
# - Background jobs: the image's www-data crontab runs cron.php every 5 minutes (/var/spool/cron/crontabs/www-data;
#   the image's own /cron.sh uses busybox crond too). crond runs in the background next to Apache; the first run of
#   cron.php switches backgroundjobs_mode from ajax to cron by itself.
# - Calls to itself: the circles app posts to its own address (overwrite.cli.url, the public https URL behind the
#   YouEye gate: 307), fails, and then does the work inside the user's request ("Loopback request failed"). Its
#   system value circles.force_nc_base (circles ConfigService::getLoopbackInstance) points it at http://localhost
#   (a trusted domain); `occ circles:check` then passes. The dot in the name rules out an env var (NC_*), so a
#   background loop sets it once Nextcloud is installed and not upgrading.
# - Nextcloud's own setup checks (occ setupchecks; owner 2026-11-24, YE-172): the maintenance window starts at 01:00
#   UTC unless an admin set one; missing optional database indices are added at every start (a no-op when none are
#   missing); the expensive repair (mimetype migrations) runs once per Nextcloud version, marked in
#   data/.youeye-expensive-repair; and Apache sends HSTS (max-age 15552000, the value the check asks for). HSTS is
#   set in the app, not in YouEye's Caddy route: the route is the platform's, and Nextcloud's docs put it in the web
#   server config. mod_headers is on in the image; the conf file lives in the container and is written at each start.
# - Connections (YE-192): YouEye brings up a connection's network interface inside the app with `ip` and `udhcpc`
#   (or dhclient), which the image lacks; its busybox has both, so they are linked into /usr/local/bin.
# An update applies `command:`, so installed copies get all of it (a cron sidecar would change the container set,
# which updates refuse; setup files don't run on update). Keep it ONE line with no single quotes: Incus cannot run
# a multi-line oci.entrypoint ("/bin/sh: 0: -c requires an argument", the update rolled back; VM 156, 2026-11-23).
command: [/bin/sh, -c, 'busybox crond -b -L /dev/null; ln -sf /usr/bin/busybox /usr/local/bin/ip; ln -sf /usr/bin/busybox /usr/local/bin/udhcpc; printf "Header always set Strict-Transport-Security \"max-age=15552000\"\n" > /etc/apache2/conf-enabled/youeye-hsts.conf; o() { runuser -u www-data -- php /var/www/html/occ "$@"; }; (until o status --output=json 2>/dev/null | grep -q "\"installed\":true,.*\"maintenance\":false,\"needsDbUpgrade\":false"; do sleep 10; done; o config:system:set circles.force_nc_base --value=http://localhost >/dev/null; o config:system:get maintenance_window_start >/dev/null || o config:system:set maintenance_window_start --type=integer --value=1 >/dev/null; o db:add-missing-indices >/dev/null 2>&1; v=$(o config:system:get version); [ "$(cat /var/www/html/data/.youeye-expensive-repair 2>/dev/null)" = "$v" ] || { o maintenance:repair --include-expensive >/dev/null 2>&1 && echo "$v" > /var/www/html/data/.youeye-expensive-repair; }) & exec /entrypoint.sh apache2-foreground']
health: {path: /status.php, timeout: 300}
internet: true
database: postgres
data:
  - /var/www/html
env:
  POSTGRES_HOST: ${database.host}
  POSTGRES_DB: ${database.name}
  POSTGRES_USER: ${database.user}
  POSTGRES_PASSWORD: ${database.password}
  NEXTCLOUD_ADMIN_USER: admin
  NEXTCLOUD_ADMIN_PASSWORD: ${secret.admin_password}
  NEXTCLOUD_TRUSTED_DOMAINS: ${app.fqdn} localhost
  # The image reads TRUSTED_PROXIES (config/reverse-proxy.config.php, at every request); NEXTCLOUD_TRUSTED_PROXIES
  # was never read before 35.0.3. Caddy reaches the app from its NIC on the app's own bridge: trust exactly that
  # /27 (${app.network_cidr}, YouEye 0.6.15). Only Caddy is in it: a connection (connects: below) gives Nextcloud
  # a NIC on the other app's bridge, never puts that app on Nextcloud's /27.
  TRUSTED_PROXIES: ${app.network_cidr}
  OVERWRITEPROTOCOL: https
  OVERWRITEHOST: ${app.fqdn}
  OVERWRITECLIURL: https://${app.fqdn}
  REDIS_HOST: ${sidecar.valkey.host}
  REDIS_HOST_PORT: '6379'
secrets:
  admin_password: {length: 24}
# Access: Nextcloud has its own sign-in (YouEye ID, app passwords for clients, the generated local admin), and its
# own clients (desktop, phone, CalDAV/CardDAV, WebDAV, login flow v2) cannot pass the YouEye gate, so it installs
# with public access: anyone on the household network (LAN/VPN) can reach it (owner rules 2026-11-13 and 2026-11-24,
# YE-133/YE-153). YouEye ID still refuses tokens to people without access to the app.
public_access: true
credentials:
  - {label: Admin Account, username: admin, password: admin_password}
sso:
  callback: /apps/user_oidc/code
  # No entry path: user_oidc's provider id is not fixed (it changes when sign-in is turned off and on).
  # With one provider and allow_multiple_user_backends=0 (setup/sso.yaml), Nextcloud's /login goes
  # straight to YouEye ID, so the app's own address is the entry.
smtp:
  env:
    SMTP_HOST: ${smtp.host}
    SMTP_PORT: ${smtp.port}
    SMTP_NAME: ${smtp.user}
    SMTP_PASSWORD: ${smtp.password}
    MAIL_FROM_ADDRESS: ${smtp.from}
    SMTP_SECURE: tls
# ONLYOFFICE Docs (YE-192): by app id, because a connection by type can't carry a setup file yet; the suite also
# provides type office-onlyoffice for when it can. The setup file installs and configures Nextcloud's onlyoffice app.
connects:
  - app: onlyoffice
    name: ONLYOFFICE Docs
    description: Open and edit office documents in Nextcloud with ONLYOFFICE Docs
    scope: service
    setup: setup/connect-onlyoffice.yaml
sidecars:
  - name: valkey
    # 9.2.0, multi-arch index (linux/amd64, linux/arm/v7, linux/arm64, linux/ppc64le)
    image: docker.io/valkey/valkey@sha256:1c2b25b09f354c66fe994733acdf12fcfd4bdf6f3bd92b88a93a70378d884056