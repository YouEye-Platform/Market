apiVersion: v1
kind: app
integration: basic
version: "2026.8.12"

metadata:
  id: "searxng"
  name: "SearXNG"
  description: "Privacy-respecting metasearch engine"
  icon: "search"
  iconUrl: "icon.svg"
  category: "search"
  website: "https://docs.searxng.org"
  developer: "SearXNG contributors"
  license: "AGPL-3.0"
  sourceCode: "https://github.com/searxng/searxng"
  support: "https://github.com/searxng/searxng/issues"
  docs: "https://docs.searxng.org"
  tagline: "Private metasearch across dozens of search engines"
  tags: ["search", "privacy", "metasearch"]
  defaultSubdomain: "searx"

detail:
  releaseNotes: |
    SearXNG 2026.8.12 from upstream revision cdfdaa5a8, paired with the current
    Valkey 8.1 maintenance image. Both multi-architecture OCI sources are
    immutable and the JSON/RSS search formats remain enabled for integrations.
  longDescription: |
    SearXNG is a free, privacy-respecting metasearch engine that aggregates
    results from dozens of independent search services. It does not profile
    users, and supports web, image, news, map, video, JSON, and RSS results.
  screenshots:
    - path: "screenshots/admin-search-results.png"
      caption: "Administrator search results aggregated from multiple engines"
    - path: "screenshots/user-search-home.png"
      caption: "Standard-user private search home page"

database:
  mode: none

secrets:
  - name: "secret_key"
    file: ".secret_key"
    generator: "secretKey"
    length: 32

containers:
  - name: "redis"
    type: oci
    image: "docker.io/valkey/valkey@sha256:a038175878d66b9d274fbf8be73c0305e93798b83917647f167e18cef3c71eec"

  - name: "main"
    type: oci
    primary: true
    image: "docker.io/searxng/searxng@sha256:c2dc2d9e6b910653e8628361c23443222490e4cabbb9e02667b7847143db843b"
    port: 8080
    network: internet
    volumes:
      - name: config
        container: "/etc/searxng"
        type: config
    healthCheck:
      type: "http"
      path: "/"
      timeout: 120000

provides:
  - type: search-engine
    description: "Privacy-respecting metasearch engine"
    port: 8080
    scope: service   # one shared SearXNG instance serves the whole server

env_mapping:
  SEARXNG_BASE_URL: "${app.url}"
  SEARXNG_SECRET: "${secrets.secret_key}"
  SEARXNG_REDIS_URL: "redis://${containers.redis.internal_host}:6379/0"
  SEARXNG_DEFAULT_LANG: "${platform.locale}"

configFiles:
  - container: "main"
    path: "/etc/searxng/settings.yml"
    permission: "0o600"
    directoryPermission: "0o700"
    template: |
      use_default_settings: true
      general:
        instance_name: "SearXNG"
      server:
        secret_key: "${secrets.secret_key}"
        bind_address: "0.0.0.0"
        port: 8080
        base_url: "${app.url}"
        limiter: false
        image_proxy: true
      search:
        safe_search: 0
        autocomplete: "duckduckgo"
        default_lang: "${platform.locale}"
        formats:
          - html
          - json
          - rss
      redis:
        url: "redis://${containers.redis.internal_host}:6379/0"
      ui:
        static_use_hash: true
        default_theme: simple
        theme_args:
          simple_style: dark
