schema: youeye.app.v1
id: searxng
version: 2026.11.23
name: SearXNG
listing:
  tagline: Private metasearch across dozens of search engines
  description: Privacy-respecting metasearch engine
  long_description: |
    SearXNG is a free, privacy-respecting metasearch engine that aggregates
    results from dozens of independent search services. It does not profile
    users, and supports web, image, news, map, video, JSON, and RSS results.
  release_notes: |
    This SearXNG build (2026-11-23) turns the Brave web search engine off by default (it hides
    the real result addresses; Brave images, news and videos stay), fixes DuckDuckGo and image
    loading, and adds new engines you can switch on in the preferences. Its cache moves to
    Valkey 8.1.12, a security fix.
  category: search
  tags: [search, privacy, metasearch]
  icon: search
  icon_file: icon.svg
  screenshots:
    - path: screenshots/searxng-home.png
      caption: "Search page with the search box"
    - path: screenshots/searxng-results.png
      caption: "Results from several search engines"
  website: https://docs.searxng.org
  developer: SearXNG contributors
  license: AGPL-3.0
  source_code: https://github.com/searxng/searxng
  support: https://github.com/searxng/searxng/issues
  docs: https://docs.searxng.org
# 2026.11.23-a7163d091, multi-arch index (linux/amd64, linux/arm, linux/arm64)
image: docker.io/searxng/searxng@sha256:a7fc607aa6723f5a8982105bcc5ffba4d1b9fc7c6922a31a88d6e4cba49ef12a
port: 8080
health: /
internet: true
data:
  - {path: /etc/searxng, kind: config}
env:
  SEARXNG_BASE_URL: ${app.url}
  SEARXNG_SECRET: ${secret.secret_key}
  SEARXNG_VALKEY_URL: valkey://${sidecar.redis.host}:6379/0
  SEARXNG_DEFAULT_LANG: ${platform.locale}
secrets:
  secret_key: {kind: key}
files:
  - path: /etc/searxng/settings.yml
    mode: '0600'
    template: |
      use_default_settings: true
      general:
        instance_name: "SearXNG"
        # Wikipedia, Wikidata and OpenStreetMap switch themselves off without a contact (their API policies want
        # one in the User-Agent). The project address, not the box's: a box address would be private and gated.
        contact_url: "https://youeye.me"
      server:
        secret_key: "${secret.secret_key}"
        bind_address: "0.0.0.0"
        port: 8080
        base_url: "${app.url}"
        limiter: false
        image_proxy: true
      search:
        safe_search: 0
        autocomplete: "duckduckgo"
        default_lang: "${platform.locale}"
        formats:
          - html
          - json
          - rss
      valkey:
        url: "valkey://${sidecar.redis.host}:6379/0"
      ui:
        static_use_hash: true
        default_theme: simple
        theme_args:
          simple_style: dark
sidecars:
  - name: redis
    # 8.1.12, multi-arch index (linux/amd64, linux/arm, linux/arm64, linux/ppc64le)
    image: docker.io/valkey/valkey@sha256:5032c4dd7abe08d6fd9382054608183e2bf1f7e3895ef619b8784698454325f7
provides:
  - {type: search-engine, description: Privacy-respecting metasearch engine, port: 8080, scope: service}
