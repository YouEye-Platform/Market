schema: youeye.app.v1
id: vaultwarden
version: 1.37.5
name: Vaultwarden
listing:
  tagline: Lightweight Bitwarden-compatible server
  description: Lightweight Bitwarden-compatible password manager
  long_description: |
    Vaultwarden is an alternative server implementation of the Bitwarden Client API, written in
    Rust and compatible with the official Bitwarden clients. Lightweight, fast, and self-hosted.
    Vaultwarden is not associated with Bitwarden, Inc.; report problems to Vaultwarden, not to
    Bitwarden's support.

    Vaultwarden has its own sign-in (YouEye ID and your master password; the admin page needs the token YouEye
    generates), so it installs with public access: anyone on your network can reach it, and the Bitwarden phone
    and desktop apps, browser extensions and the command line work. To keep it to people with a YouEye account
    instead, turn public access off in the install dialog or later in the app's access settings.
  release_notes: |
    Vaultwarden 1.37.5 is a security release: it fixes two advisories (website icon
    fetching and emergency access) and ships web vault 2026.10.1. It is needed for the
    two-step login settings of newer web vaults and fixes email two-step login after
    YouEye ID sign-in on phones.

    New installs are reachable by anyone on your network, because the app has its own sign-in; on an installed
    copy, turn on public access in the app's access settings if you want that.
  category: utilities
  tags: [passwords, security, bitwarden]
  icon: lock
  icon_file: icon.svg
  screenshots:
    - path: screenshots/vaultwarden-sign-in.png
      caption: "Sign-in page with single sign-on through YouEye ID"
    - path: screenshots/vaultwarden-vault.png
      caption: "The vault with a few demo items: logins, a secure note and a card"
  website: https://github.com/dani-garcia/vaultwarden
  developer: Daniel García
  license: AGPL-3.0
  source_code: https://github.com/dani-garcia/vaultwarden
  support: https://vaultwarden.discourse.group
  docs: https://github.com/dani-garcia/vaultwarden/wiki
# 1.37.5, multi-arch index (linux/amd64, linux/arm, linux/arm64)
image: docker.io/vaultwarden/server@sha256:4fe17f415f90087377d37c755e0ea3cf189dcc6794e49cdd2a9adbb4937d9e1f
port: 80
health: /alive
internet: true
database: postgres
data:
  - /data
env:
  DOMAIN: ${app.url}
  DATABASE_URL: ${database.url}?sslmode=disable
  ADMIN_TOKEN: ${secret.admin_token}
  ROCKET_PORT: '80'
  ROCKET_ADDRESS: 0.0.0.0
  # No local sign-up: accounts come from YouEye ID (SSO_SIGNUPS_ALLOWED, default true, is separate from
  # SIGNUPS_ALLOWED in Vaultwarden 1.37) or from an invitation.
  SIGNUPS_ALLOWED: 'false'
  INVITATIONS_ALLOWED: 'true'
  SHOW_PASSWORD_HINT: 'false'
  # The Control Panel stages its local root CA after the OCI health gate. Vaultwarden
  # 1.37's reqwest startup now honors SSL_CERT_FILE immediately, so point it at the
  # image's existing system bundle; the later CA injection updates this same bundle.
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
secrets:
  admin_token: {kind: key, length: 48}
# Access: Vaultwarden has its own sign-in, so it installs with public access: anyone on the household network
# (LAN/VPN) can reach it, protected by the app (owner rules 2026-11-13 and 2026-11-24, decisions.md "YouEye lives
# on the LAN; apps behave like upstream"; YE-153). YouEye ID still refuses tokens to people without access to the
# app.
public_access: true
sso:
  callback: /identity/connect/oidc-signin
  env:
    SSO_ENABLED: 'true'
    SSO_ONLY: 'false'
    # Never attach a YouEye ID sign-in to an existing password account with the same email (an invited
    # address someone registered first). Invitations not yet accepted still link.
    SSO_SIGNUPS_MATCH_EMAIL: 'false'
    # Split-channel: SSO authority/discovery over the INTERNAL identity DNAT (${sso.issuer}
    # = http://<app-gw>:3002/application/o/youeye-app-vaultwarden/). Vaultwarden's Rust
    # openidconnect crate is STRICT: it discovers from SSO_AUTHORITY and requires the
    # id_token `iss` to equal it. The CP discovery doc + id_token both emit this exact
    # clientId-derived internal authority, so it validates — even under full isolation.
    SSO_AUTHORITY: ${sso.issuer}
    SSO_CLIENT_ID: ${sso.client_id}
    SSO_CLIENT_SECRET: ${sso.client_secret}
    SSO_PKCE: 'true'
    # Vaultwarden adds the mandatory openid scope itself; list only the extra scopes
    # advertised by YouEye ID so the authorization request contains no duplicate value.
    SSO_SCOPES: email profile
smtp:
  env:
    SMTP_HOST: ${smtp.host}
    SMTP_PORT: ${smtp.port}
    SMTP_USERNAME: ${smtp.user}
    SMTP_PASSWORD: ${smtp.password}
    SMTP_FROM: ${smtp.from}
    SMTP_SECURITY: starttls
