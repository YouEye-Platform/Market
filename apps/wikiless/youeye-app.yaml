schema: youeye.app.v1
id: wikiless
version: 2026.11.17
name: Wikiless
listing:
  tagline: Read Wikipedia through a private, JavaScript-free frontend
  description: Privacy-respecting Wikipedia frontend
  long_description: |
    Wikiless is a free, open-source alternative frontend for Wikipedia. It proxies
    article pages and media through your own server, strips tracking-oriented browser
    behavior, requires no client-side JavaScript, and provides a lightweight reading
    experience with language and theme preferences. It can also offer a useful route
    to Wikipedia content where the original site is blocked.
  release_notes: |
    This Wikiless build (2026-11-17, commit 728ad9b) updates its dependencies and
    Node runtime. Its cache moves to Valkey 8.1.11, a security fix.
  category: search
  tags: [wikipedia, privacy, wiki, knowledge, no-javascript]
  icon: book-open
  icon_file: icon.svg
  screenshots:
    - path: screenshots/wikiless-article.png
      caption: "A Wikipedia article read through Wikiless"
    - path: screenshots/wikiless-home.png
      caption: "Start page with search"
  website: https://wikiless.tiekoetter.com
  developer: Wikiless contributors; maintained by tiekoetter
  license: AGPL-3.0-only
  source_code: https://github.com/tiekoetter/Wikiless
  support: https://github.com/tiekoetter/Wikiless/issues
  docs: https://github.com/tiekoetter/Wikiless/wiki
# sha-728ad9b (upstream commit 728ad9b of 2026-11-17; Wikiless has no releases, so the version is the build date).
# Upstream publishes linux/amd64 only.
image: ghcr.io/tiekoetter/wikiless@sha256:8da26a927e61f441c92f86966754ae97b0de9fbde5e6c1fe4334368cdaa5aa44
port: 8080
health: /health
internet: true
data:
  - {path: /wikiless/media, kind: cache}
env:
  REDIS_URL: redis://${sidecar.redis.host}:6379
  DOMAIN: ${app.fqdn}
  DEFAULT_LANG: en
  THEME: dark
  NONSSL_PORT: '8080'
  wikimedia_useragent: Wikiless/0.1.3 (https://github.com/tiekoetter/Wikiless)
sidecars:
  - name: redis
    # 8.1.11, multi-arch index
    image: docker.io/valkey/valkey@sha256:8f836008e0986c36adf50da714c7060cf689dbb335f61fe077939d90fa650809
    data:
      - {path: /data, kind: cache}
