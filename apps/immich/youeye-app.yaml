schema: youeye.app.v1
id: immich
version: 3.4.2
name: Immich
listing:
  tagline: Self-hosted photo and video backup
  description: Self-hosted photo and video management
  long_description: |
    High performance self-hosted photo and video management solution with automatic backup,
    intelligent search, facial recognition, and shared albums.
  release_notes: |
    Immich 3.4.2 is a fix release: slideshows, file names in the timeline, integrity report
    downloads and hardware video transcoding colours work properly again. Your photos, albums
    and database stay as they are. Its cache moves to Valkey 9.1.4, a security fix.
  category: media
  tags: [photos, videos, gallery, machine-learning]
  icon: camera
  icon_file: icon.svg
  screenshots:
    - path: screenshots/web-timeline-light.webp
      caption: "Photo timeline with albums, map and sharing in the sidebar"
    - path: screenshots/admin-server-stats.webp
      caption: "Administration: server statistics per user"
  website: https://immich.app
  developer: Immich
  license: AGPL-3.0
  source_code: https://github.com/immich-app/immich
  support: https://discord.immich.app
  docs: https://immich.app/docs
# v3.4.2, multi-arch index (linux/amd64, linux/arm64)
image: ghcr.io/immich-app/immich-server@sha256:fc880c1bf665b4aab1e74c15e56ab871225989cd546536e6b77e771869af06bd
port: 2283
health: {path: /api/server/ping, timeout: 180}
internet: true
database: {sidecar: postgres, name: immich, user: immich}
data:
  - /data
env:
  DB_HOSTNAME: ${sidecar.postgres.host}
  DB_PORT: '5432'
  DB_USERNAME: immich
  DB_PASSWORD: ${secret.db_password}
  DB_DATABASE_NAME: immich
  REDIS_HOSTNAME: ${sidecar.valkey.host}
  REDIS_PORT: '6379'
  IMMICH_MACHINE_LEARNING_URL: http://${sidecar.ml.host}:3003
  IMMICH_HOST: 0.0.0.0
secrets:
  admin_password: {length: 24}
# Created at install (setup/install.yaml). While YouEye ID sign-in is on, password login is off and this
# account is kept for setup re-runs and recovery (`immich-admin enable-password-login`).
credentials:
  - {label: Admin Account (password login is off while YouEye ID sign-in is on), username: admin@youeye.local, password: admin_password}
sso:
  callback: /auth/login
  entry: /auth/login?autoLaunch=1
  extra_callbacks: [/user-settings, 'app.immich:///oauth-callback']
  role_claim: {claim: immich_role, admin_value: admin, default_value: user}
sidecars:
  # Immich migrated its vector backend from pgvecto.rs to VectorChord (server v1.133+). This
  # purpose-built image (Postgres 14) bundles VectorChord + a pgvecto.rs compat layer. On a fresh
  # install VectorChord is auto-selected, so DB_VECTOR_EXTENSION is intentionally unset.
  - name: postgres
    image: ghcr.io/immich-app/postgres@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    data:
      - /var/lib/postgresql/data
    env:
      POSTGRES_PASSWORD: ${secret.db_password}
      POSTGRES_USER: immich
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: --data-checksums
    health: {postgres: immich, timeout: 60}
  - name: valkey
    # 9.1.4, multi-arch index (linux/amd64, linux/arm, linux/arm64, linux/ppc64le)
    image: docker.io/valkey/valkey@sha256:3ab0eca823ebbf0fe352476ebac330ac9e5f14b592b9a954eab296d341e81b0e
  - name: ml
    # v3.4.2, multi-arch index (linux/amd64, linux/arm64)
    image: ghcr.io/immich-app/immich-machine-learning@sha256:739405742a79bd7447227c553bb62ed5491aa36acf00bc667af7f9c93b6fae91
    data:
      - {path: /cache, kind: cache}
