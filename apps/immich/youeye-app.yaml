apiVersion: v1
kind: app
integration: basic
version: "3.1.0"

metadata:
  id: "immich"
  name: "Immich"
  description: "Self-hosted photo and video management"
  icon: "camera"
  iconUrl: "icon.svg"
  category: "media"
  website: "https://immich.app"
  developer: "Immich"
  license: "AGPL-3.0"
  sourceCode: "https://github.com/immich-app/immich"
  support: "https://discord.immich.app"
  docs: "https://immich.app/docs"
  tagline: "Self-hosted photo and video backup"
  tags: ["photos", "videos", "gallery", "machine-learning"]
  defaultSubdomain: "photos"

detail:
  releaseNotes: |
    Immich 3.1.0 fresh-install manifest with immutable server, machine-learning,
    PostgreSQL, and Valkey images. Uses the Immich 3 data layout and VectorChord
    database stack, with native YouEye identity integration.
  longDescription: |
    High performance self-hosted photo and video management solution with automatic backup,
    intelligent search, facial recognition, and shared albums.
  screenshots:
    - path: "screenshots/admin-library.png"
      caption: "Administrator photo library with a representative test image"
    - path: "screenshots/user-library.png"
      caption: "A separate standard user's empty personal photo library"

database:
  mode: own
  container: "postgres"

secrets:
  - name: "db_password"
    file: ".db_password"
    generator: "password"
    length: 32
  - name: "admin_password"
    file: ".admin_password"
    generator: "password"
    length: 24

credentials:
  - label: "Admin Account"
    username: "admin@youeye.local"
    passwordSecret: "admin_password"

containers:
  - name: "postgres"
    type: oci
    # Immich migrated its vector backend from pgvecto.rs (tensorchord) to
    # VectorChord (server v1.133+). This purpose-built image (Postgres 14)
    # bundles VectorChord + a pgvecto.rs compat layer. On a FRESH install
    # VectorChord is auto-selected, so DB_VECTOR_EXTENSION is intentionally unset.
    image: "ghcr.io/immich-app/postgres@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23"
    environment:
      POSTGRES_PASSWORD: "${secrets.db_password}"
      POSTGRES_USER: "immich"
      POSTGRES_DB: "immich"
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - name: pgdata
        container: "/var/lib/postgresql/data"
        type: data
    healthCheck:
      type: "postgres"
      user: "immich"
      timeout: 60000

  - name: "valkey"
    type: oci
    image: "docker.io/valkey/valkey@sha256:8e8d64b405ce18f41b8e5ee20aa4687a8ed0022d1298f2ce31cdcf3a76e09411"

  - name: "server"
    type: oci
    primary: true
    image: "ghcr.io/immich-app/immich-server@sha256:b434cb9287eea1471c9974845914d4dd328c9c2d652e446ed4930f99944f0ceb"
    port: 2283
    network: internet
    environment:
      DB_HOSTNAME: "app-${app.id}-postgres.youeye"
      DB_PORT: "5432"
      DB_USERNAME: "immich"
      DB_PASSWORD: "${secrets.db_password}"
      DB_DATABASE_NAME: "immich"
      REDIS_HOSTNAME: "app-${app.id}-valkey.youeye"
      REDIS_PORT: "6379"
      IMMICH_MACHINE_LEARNING_URL: "http://app-${app.id}-ml.youeye:3003"
      IMMICH_HOST: "0.0.0.0"
    volumes:
      - name: upload
        container: "/data"
        type: data
    healthCheck:
      type: "http"
      path: "/api/server/ping"
      timeout: 180000

  - name: "ml"
    type: oci
    image: "ghcr.io/immich-app/immich-machine-learning@sha256:5a0839dc5303cd7215bcd2180a26aed3af41675aefb3e75e5157e9f10ad16e6e"
    volumes:
      - name: mlcache
        container: "/cache"
        type: cache

backup:
  ownPostgres:
    container: "app-${app.id}-postgres"
    database: "immich"
