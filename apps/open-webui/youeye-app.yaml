schema: youeye.app.v1
id: open-webui
version: 0.11.0
name: Open WebUI
listing:
  tagline: Chat with the model group selected in YouEye AI Settings
  description: A polished chat workspace for your YouEye AI models
  long_description: |
    Open WebUI is a private, self-hosted AI chat workspace. When Use AI Settings is enabled,
    YouEye creates a dedicated Pointer connection for this installation and makes the selected
    model group's aliases and models available immediately. Open WebUI's own provider controls
    remain available for any additional providers you choose to configure later.
  release_notes: |
    Open WebUI 0.11.0 is integrated with YouEye AI Settings and YouEye ID.
    Each installation can receive its own Pointer instance and selected model
    group while Open WebUI's own provider controls remain available.
  category: ai
  tags: [ai, chat, openai-compatible, models]
  icon: message-circle
  icon_file: icon.svg
  screenshots:
    - path: screenshots/platform-admin-chat-0.11.0.png
      caption: Open WebUI chat ready for a YouEye platform administrator
    - path: screenshots/standard-user-chat-0.11.0.png
      caption: Open WebUI chat ready for a standard YouEye ID user
  website: https://openwebui.com
  developer: Open WebUI contributors
  # The selected v0.11.0 release uses the Open WebUI License, including branding conditions.
  # https://github.com/open-webui/open-webui/blob/v0.11.0/LICENSE
  license: Open WebUI License
  source_code: https://github.com/open-webui/open-webui
  support: https://github.com/open-webui/open-webui/discussions
  docs: https://docs.openwebui.com
image: ghcr.io/open-webui/open-webui@sha256:72c0ba641ba75e7aa52655cb242570906ececd09b1140fb736483038a22b3228
port: 8080
health: {path: /health, timeout: 300}
internet: true
data:
  - /app/backend/data
env:
  WEBUI_URL: ${app.url}
  WEBUI_SECRET_KEY: ${secret.webui_secret_key}
  # Env is the configuration on every start. With persistent config on (the default), Open WebUI copies
  # env into its database on first start and ignores env after that, so later AI Settings and address
  # changes would never arrive. Settings changed in the admin panel last until the next restart.
  ENABLE_PERSISTENT_CONFIG: 'false'
  ENABLE_SIGNUP: 'false'
  DEFAULT_USER_ROLE: user
  BYPASS_MODEL_ACCESS_CONTROL: 'true'
  ENABLE_OLLAMA_API: 'false'
  ENABLE_OPENAI_API: 'true'
  SCARF_NO_ANALYTICS: 'true'
  DO_NOT_TRACK: 'true'
  ANONYMIZED_TELEMETRY: 'false'
secrets:
  webui_secret_key: {kind: key, length: 64}
sso:
  callback: /oauth/oidc/callback
  role_claim: {claim: openwebui_role, admin_value: admin, default_value: user}
  env:
    ENABLE_OAUTH_SIGNUP: 'true'
    OAUTH_PROVIDER_NAME: ${identity.name}
    OAUTH_CLIENT_ID: ${sso.client_id}
    OAUTH_CLIENT_SECRET: ${sso.client_secret}
    OPENID_PROVIDER_URL: ${sso.discovery_url}
    OPENID_REDIRECT_URI: ${app.url}/oauth/oidc/callback
    OAUTH_SCOPES: openid email profile openwebui_role
    # Roles follow YouEye ID on every sign-in through the per-app claim openwebui_role (sso.role_claim):
    # YouEye ID admins -> admin, everyone else -> user. (Open WebUI still makes the very first account admin;
    # new apps are owner-only until the owner shares them, so that is the owner, and role management
    # corrects it at the next sign-in once a second user exists.)
    ENABLE_OAUTH_ROLE_MANAGEMENT: 'true'
    OAUTH_ROLES_CLAIM: openwebui_role
    OAUTH_ADMIN_ROLES: admin
    OAUTH_ALLOWED_ROLES: user
ai:
  env:
    OPENAI_API_BASE_URL: ${ai.openai_base_url}
    OPENAI_API_KEY: ${ai.api_key}
    DEFAULT_MODELS: ${ai.default_model}
    TASK_MODEL_EXTERNAL: ${ai.utility_model}
