schema: youeye.app.v1
id: open-webui
version: 0.13.4.1
name: Open WebUI
listing:
  tagline: Chat with the model group selected in YouEye AI Settings
  description: A polished chat workspace for your YouEye AI models
  long_description: |
    Open WebUI is a private, self-hosted AI chat workspace. When Use AI Settings is enabled,
    YouEye creates a dedicated Pointer connection for this installation and makes the selected
    model group's aliases and models available immediately. Open WebUI's own provider controls
    remain available for any additional providers you choose to configure later.

    Open WebUI has its own sign-in (YouEye ID, or the admin password YouEye generates), so it installs with
    public access: anyone on your network can reach it, and Open WebUI works on every device, as an app on your
    phone too. To keep it to people with a YouEye account instead, turn public access off in the install dialog
    or later in the app's access settings.
  release_notes: |
    Open WebUI 0.13.4 brings faster chats, better sign-in session handling and many fixes.
    Personal "Direct connections" and "Direct tool servers" in a user's own settings were
    removed upstream (they moved to the separate Tether app), so a model connection someone
    added there for themselves is gone. Models from YouEye AI are not affected.
    No database migration.

    New installs create Open WebUI's admin account themselves (its password is under the
    app's credentials), so the first person to open the app no longer becomes its admin.

    New installs are reachable by anyone on your network, because the app has its own sign-in; on an installed
    copy, turn on public access in the app's access settings if you want that.
  category: ai
  tags: [ai, chat, openai-compatible, models]
  icon: message-circle
  icon_file: icon.svg
  screenshots:
    - path: screenshots/chat-workspace.png
      caption: "Chats, notes and channels beside a generated page in a preview tab"
    - path: screenshots/admin-general-settings.png
      caption: "Admin panel: general settings"
  website: https://openwebui.com
  developer: Open WebUI Inc. and contributors
  # The selected v0.13.4 release uses the Open WebUI License, including branding conditions (LICENSE.upstream.txt).
  # https://github.com/open-webui/open-webui/blob/v0.13.4/LICENSE
  license: Open WebUI License
  source_code: https://github.com/open-webui/open-webui
  support: https://github.com/open-webui/open-webui/discussions
  docs: https://docs.openwebui.com
# v0.13.4, multi-arch index (linux/amd64, linux/arm64)
image: ghcr.io/open-webui/open-webui@sha256:d5168bfbc28609eff5bea1b438dd864cf64d185cf6582c02244865e18385b901
port: 8080
health: {path: /health, timeout: 300}
internet: true
data:
  - /app/backend/data
env:
  WEBUI_URL: ${app.url}
  WEBUI_SECRET_KEY: ${secret.webui_secret_key}
  # Env is the configuration on every start. With persistent config on (the default), Open WebUI copies
  # env into its database on first start and ignores env after that, so later AI Settings and address
  # changes would never arrive. Settings changed in the admin panel last until the next restart.
  ENABLE_PERSISTENT_CONFIG: 'false'
  ENABLE_SIGNUP: 'false'
  DEFAULT_USER_ROLE: user
  BYPASS_MODEL_ACCESS_CONTROL: 'true'
  ENABLE_OLLAMA_API: 'false'
  ENABLE_OPENAI_API: 'true'
  SCARF_NO_ANALYTICS: 'true'
  DO_NOT_TRACK: 'true'
  ANONYMIZED_TELEMETRY: 'false'
secrets:
  webui_secret_key: {kind: key, length: 64}
  admin_password: {length: 24}
# Access: Open WebUI has its own sign-in, so it installs with public access: anyone on the household network
# (LAN/VPN) can reach it, protected by the app (owner rules 2026-11-13 and 2026-11-24, decisions.md "YouEye lives
# on the LAN; apps behave like upstream"; YE-153). YouEye ID still refuses tokens to people without access to the
# app.
public_access: true
credentials:
  - {label: Admin account (YouEye ID admins are Open WebUI admins too), username: admin@localhost, password: admin_password}
sso:
  callback: /oauth/oidc/callback
  role_claim: {claim: openwebui_role, admin_value: admin, default_value: user}
  env:
    ENABLE_OAUTH_SIGNUP: 'true'
    OAUTH_PROVIDER_NAME: ${identity.name}
    OAUTH_CLIENT_ID: ${sso.client_id}
    OAUTH_CLIENT_SECRET: ${sso.client_secret}
    OPENID_PROVIDER_URL: ${sso.discovery_url}
    OPENID_REDIRECT_URI: ${app.url}/oauth/oidc/callback
    OAUTH_SCOPES: openid email profile openwebui_role
    # Roles follow YouEye ID on every sign-in through the per-app claim openwebui_role (sso.role_claim):
    # YouEye ID admins -> admin, everyone else -> user. The very first account, which Open WebUI makes admin, is
    # the local `admin@localhost` that setup/install.yaml creates before the app has a route.
    ENABLE_OAUTH_ROLE_MANAGEMENT: 'true'
    OAUTH_ROLES_CLAIM: openwebui_role
    OAUTH_ADMIN_ROLES: admin
    OAUTH_ALLOWED_ROLES: user
ai:
  env:
    OPENAI_API_BASE_URL: ${ai.openai_base_url}
    OPENAI_API_KEY: ${ai.api_key}
    DEFAULT_MODELS: ${ai.default_model}
    TASK_MODEL_EXTERNAL: ${ai.utility_model}
