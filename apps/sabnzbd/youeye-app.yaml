schema: youeye.app.v1
id: sabnzbd
version: 5.1.3
name: SABnzbd
listing:
  tagline: Usenet downloads, fully automated
  description: Binary newsreader that downloads, verifies, repairs and unpacks NZB downloads
  long_description: |
    SABnzbd downloads from Usenet: add an NZB file (or let Sonarr and Radarr send one) and it fetches every
    article, checks and repairs the files with par2, unpacks them and files them away, with no clicks in between.
    Queue priorities, categories, speed limits, schedules and RSS feeds are built in.

    You need a paid Usenet provider (a news server account) and an NZB indexer of your own: SABnzbd can't download
    anything without them. The first time you open it, its setup wizard asks for your provider's server details.

    As a download client for the media apps it saves finished downloads to the shared media folder
    (usenet/complete), where Sonarr and Radarr import them. Connect it to them from SABnzbd's Connections: it adds
    itself as a download client in each.

    SABnzbd has its own sign-in (user admin and the password YouEye generates, shown under Credentials), so it
    installs with public access: anyone on your network can reach the sign-in page, and phone apps for SABnzbd work
    with its API key. To keep it to people with a YouEye account instead, turn public access off in the install
    dialog or later in the app's access settings.
  release_notes: |
    First Market release: SABnzbd 5.1.3 (LinuxServer build ls282), with the 2026 security fixes of 5.1.1 to 5.1.3.
  category: downloaders
  tags: [downloader, usenet, nzb, arr]
  icon: download
  icon_file: icon.svg
  screenshots:
    - path: screenshots/sabnzbd-queue-history.png
      caption: "Queue and history in the Glitter interface (project website screenshot, older version)"
    - path: screenshots/sabnzbd-add-nzb.png
      caption: "Adding an NZB by URL or upload, with category, priority and post-processing"
    - path: screenshots/sabnzbd-night-mode.png
      caption: "Night mode with the details of a finished download"
  website: https://sabnzbd.org
  developer: The SABnzbd-Team
  license: GPL-2.0-or-later
  source_code: https://github.com/sabnzbd/sabnzbd
  support: https://forums.sabnzbd.org
  docs: https://sabnzbd.org/wiki/
# 5.1.3-ls282, multi-arch index (linux/amd64, linux/arm64). Upstream publishes no image of its own; its install page
# links LinuxServer's (https://sabnzbd.org/wiki/installation/install-unix).
image: docker.io/linuxserver/sabnzbd@sha256:d225bbab93f54784c115a3b1d89711e469b1969c9f32aa6ebb11fb03b5804431
port: 8080
# The version call answers 200 without key or login once the web server is up (sabnzbd/api.py _api_version, the
# same call LinuxServer's readiness check makes); "/" only redirects to /login/ or /wizard/.
health: {path: /api?mode=version&output=json, timeout: 180}
internet: true                    # the Usenet provider (NNTP 563/119), indexers, version check
data:
  - {path: /config, kind: config}
  - {path: /custom-cont-init.d, kind: config}
shared:
  media: /data
env:
  PUID: '0'
  PGID: '0'
  TZ: ${platform.timezone}
  YOUEYE_SABNZBD_API_KEY: ${secret.api_key}
  YOUEYE_SABNZBD_PASSWORD: ${secret.admin_password}
  YOUEYE_SABNZBD_URL: ${app.url}
secrets:
  # 32 hex characters, the shape SABnzbd generates itself; hex so a peer that passes it on never meets '+' or '/'.
  api_key: {kind: hex, length: 16}
  admin_password: {length: 24}
# Access: SABnzbd has its own sign-in (the generated WebUI password), so it installs with public access: anyone on
# the household network (LAN/VPN) can reach its sign-in page (owner rules 2026-11-13 and 2026-11-24, decisions.md
# "YouEye lives on the LAN; apps behave like upstream"). Upstream's login has no bypass for local addresses unless
# inet_exposure is 5 ("webui with login for external", sabnzbd/interface.py check_login): the script below turns
# 5 into 4 on every start (same external access, login kept). Pin >= 5.1.3 (the 2026 auth-bypass fixes, README.mkd).
public_access: true
credentials:
  - {label: WebUI Administrator, username: admin, password: admin_password}
files:
  - path: /custom-cont-init.d/10-youeye-sabnzbd
    mode: '0700'
    template: |
      #!/usr/bin/with-contenv bash
      set -euo pipefail

      # SABnzbd rewrites sabnzbd.ini itself (first start, conversions, every setting saved in the UI), so YouEye
      # never templates it: this script runs before the service on every start and edits only YouEye's keys, with
      # SABnzbd's own configobj (/lsiopy). Recovery for a lost password: delete /config/.youeye-credential-ready and
      # restart the app (the generated one is written again).
      /lsiopy/bin/python3 - <<'PY'
      import os
      from pathlib import Path
      from urllib.parse import urlparse
      from configobj import ConfigObj

      ini_path = Path("/config/sabnzbd.ini")
      marker_path = Path("/config/.youeye-credential-ready")
      api_key = os.environ["YOUEYE_SABNZBD_API_KEY"]
      password = os.environ["YOUEYE_SABNZBD_PASSWORD"]
      hostname = urlparse(os.environ["YOUEYE_SABNZBD_URL"]).hostname
      if len(api_key) < 32 or len(password) < 12 or not hostname:
          raise RuntimeError("YouEye's SABnzbd settings are unavailable")

      config = ConfigObj(str(ini_path), encoding="utf-8", default_encoding="utf-8")   # absent file: empty
      if "misc" not in config:
          config["misc"] = {}
      misc = config["misc"]

      # Every start: connected apps use YouEye's API key, and the WebUI accepts the app's current address (the
      # host check applies only when the login is removed).
      misc["api_key"] = api_key
      hosts = misc.get("host_whitelist", [])
      hosts = [hosts] if isinstance(hosts, str) else list(hosts)
      hosts = [entry.strip() for entry in hosts if entry.strip()]
      if hostname not in hosts:
          hosts.append(hostname)
      misc["host_whitelist"] = hosts
      # The login is never skipped: inet_exposure 5 ("webui with login for external") lets every local address in
      # without it, the app network and Caddy included. 4 keeps the same external access with the login.
      if str(misc.get("inet_exposure", "0")).strip() == "5":
          misc["inet_exposure"] = "4"

      # Once: the sign-in, and downloads on the shared media volume so imports are moves, not copies.
      # What the owner changes later in SABnzbd is kept.
      first = not marker_path.exists()
      if first:
          misc["username"] = "admin"
          misc["password"] = password
          misc["download_dir"] = "/data/usenet/incomplete"
          misc["complete_dir"] = "/data/usenet/complete"

      config.write()
      ini_path.chmod(0o600)
      if first:
          marker_path.write_text("ready\n")
          marker_path.chmod(0o600)

      for path in ("/data/usenet/incomplete", "/data/usenet/complete", "/data/media/tv", "/data/media/movies"):
          Path(path).mkdir(mode=0o775, parents=True, exist_ok=True)
      PY
provides:
  - {type: download-client, description: Usenet download client (SABnzbd), port: 8080, scope: service}
# SABnzbd registers itself in the media apps with target: peer (it holds both keys); the peer calls it back on this
# connection's NIC. Its category is created first: Sonarr and Radarr refuse a client whose category is missing.
connects:
  - app: sonarr
    name: Sonarr
    description: Receive TV downloads from Sonarr
    scope: service
    setup: setup/connect-sonarr.yaml
  - app: radarr
    name: Radarr
    description: Receive movie downloads from Radarr
    scope: service
    setup: setup/connect-radarr.yaml
api_key: {secret: api_key}
