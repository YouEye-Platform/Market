schema: youeye.app.v1
id: linkwarden
version: 2.17.0
name: Linkwarden
listing:
  tagline: Bookmarks evolved, preserved, and shared
  description: Collaborative bookmark manager with web archiving
  long_description: |
    Linkwarden is a collaborative bookmark manager that lets you collect, organize, and
    preserve web links. Features include automatic web page archiving (screenshots + PDFs),
    tag-based organization, collections, full-text search, and multi-user collaboration.

    Sign-in: the first person who signs in with YouEye ID becomes Linkwarden's admin; Linkwarden cannot
    take roles from YouEye ID. A new app is open only to you until you share it, so sign in once yourself
    before sharing it.
  release_notes: |
    Linkwarden 2.17.0 improves sign-in with YouEye ID, link previews and archiving, and
    can run its container without root.
  category: productivity
  tags: [bookmarks, links, archive, collections]
  icon: link
  icon_file: icon.svg
  screenshots:
    - path: screenshots/hero-dashboard.png
      caption: "Dashboard with recent links and collections, on desktop and phone"
    - path: screenshots/app-screenshot-2.png
      caption: "Dashboard with link previews and pinned links"
  website: https://linkwarden.app
  developer: Linkwarden contributors
  license: AGPL-3.0
  source_code: https://github.com/linkwarden/linkwarden
  support: https://github.com/linkwarden/linkwarden/discussions
  docs: https://docs.linkwarden.app/
# v2.17.0, multi-arch index (linux/amd64, linux/arm64)
image: ghcr.io/linkwarden/linkwarden@sha256:7c11fde57d1a0c819b6de0079966eba3a33584d718464af7dacde22bd470ae46
port: 3000
health: {path: /, timeout: 180}
internet: true
database: postgres
data:
  - /data/data
env:
  NEXTAUTH_URL: ${app.url}/api/v1/auth
  NEXTAUTH_SECRET: ${secret.secret_key}
  DATABASE_URL: ${database.url}?sslmode=disable
  NEXT_PUBLIC_CREDENTIALS_ENABLED: 'false'
  NEXT_PUBLIC_DISABLE_REGISTRATION: 'true'
secrets:
  secret_key: {kind: key}
sso:
  callback: /api/v1/auth/callback/authentik
  env:
    NEXT_PUBLIC_AUTHENTIK_ENABLED: 'true'
    AUTHENTIK_CUSTOM_NAME: ${identity.name}
    # Linkwarden's Authentik provider appends the discovery path itself and
    # requires this issuer without a trailing slash.
    AUTHENTIK_ISSUER: ${identity.internal_url}/application/o/youeye-app-${app.id}
    AUTHENTIK_CLIENT_ID: ${sso.client_id}
    AUTHENTIK_CLIENT_SECRET: ${sso.client_secret}
