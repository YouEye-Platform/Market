apiVersion: v1
kind: app
integration: basic
version: "2.16.0"

metadata:
  id: "linkwarden"
  name: "Linkwarden"
  description: "Collaborative bookmark manager with web archiving"
  icon: "link"
  iconUrl: "icon.svg"
  category: "productivity"
  website: "https://linkwarden.app"
  developer: "Linkwarden contributors"
  license: "AGPL-3.0"
  sourceCode: "https://github.com/linkwarden/linkwarden"
  support: "https://github.com/linkwarden/linkwarden/discussions"
  docs: "https://docs.linkwarden.app/"
  tagline: "Bookmarks evolved, preserved, and shared"
  tags: ["bookmarks", "links", "archive", "collections"]
  defaultSubdomain: "links"

detail:
  releaseNotes: |
    Linkwarden 2.16.0 refreshes the web interface and search experience, adds a
    system theme, supports PNG link banners, and extends the mobile clients with
    self-signed certificate, custom-header, and re-preservation capabilities.
  longDescription: |
    Linkwarden is a collaborative bookmark manager that lets you collect, organize, and
    preserve web links. Features include automatic web page archiving (screenshots + PDFs),
    tag-based organization, collections, full-text search, and multi-user collaboration.
  screenshots:
    - path: "screenshots/platform-admin-library-2.16.0.png"
      caption: "Platform administrator organizing an accepted bookmark collection"
    - path: "screenshots/standard-user-library-2.16.0.png"
      caption: "Standard user viewing an independently accepted bookmark library"

database:
  mode: shared
  name: "linkwarden"
  user: "linkwarden"

secrets:
  - name: "db_password"
    file: ".db_password"
    generator: "password"
    length: 32
  - name: "secret_key"
    file: ".secret_key"
    generator: "secretKey"
    length: 32

containers:
  - name: "main"
    type: oci
    primary: true
    image: "ghcr.io/linkwarden/linkwarden@sha256:d805877fb707d160b809027c302f84cfba11a248d7fdc12de90b4791f98e6b55"
    port: 3000
    network: internet
    volumes:
      - name: data
        container: "/data/data"
        type: data
    healthCheck:
      type: "http"
      path: "/"
      timeout: 180000

sso:
  type: oauth2
  callback_path: /api/v1/auth/callback/authentik
  setup:
    method: env
  redirectUris:
    - url: "${install.url}/api/v1/auth/callback/authentik"

env_mapping:
  NEXTAUTH_URL: "${app.url}/api/v1/auth"
  NEXTAUTH_SECRET: "${secrets.secret_key}"
  DATABASE_URL: "${database.dsn}"
  NEXT_PUBLIC_CREDENTIALS_ENABLED: "false"
  NEXT_PUBLIC_DISABLE_REGISTRATION: "true"
  NEXT_PUBLIC_AUTHENTIK_ENABLED: "true"
  AUTHENTIK_CUSTOM_NAME: "${identity.name}"
  # Linkwarden's Authentik provider appends the discovery path itself and
  # requires this issuer without a trailing slash.
  AUTHENTIK_ISSUER: "${identity.internalUrl}/application/o/youeye-app-${app.id}"
  AUTHENTIK_CLIENT_ID: "${sso.client_id}"
  AUTHENTIK_CLIENT_SECRET: "${sso.client_secret}"

uninstall:
  dropSharedDatabase: true
