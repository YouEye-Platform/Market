schema: youeye.app.v1
id: audiobookshelf
version: 2.38.0
name: Audiobookshelf
listing:
  tagline: Your audiobooks and podcasts, on your server
  description: Audiobook and podcast server with progress tracking
  long_description: |
    Audiobookshelf is a self-hosted audiobook and podcast server. Features include per-user
    progress tracking, chapter support, bookmarks, sleep timer, playback speed control,
    and companion apps for Android and iOS. Import your audiobook collection and listen from
    anywhere.
  release_notes: |
    Audiobookshelf 2.38.0 is a security and fix release: listeners only see the books, sessions,
    progress, collections and feeds they have access to, uploads need a sign-in, and podcast
    descriptions are cleaned. Library scans no longer crash on duplicate authors or series or
    on emoji in series names. Removing a book from a collection now needs the "update"
    permission instead of "delete".
  category: media
  tags: [audiobooks, podcasts, media, streaming]
  icon: headphones
  icon_file: icon.svg
  screenshots:
    - path: screenshots/demo-library.png
      caption: "Audiobook library with the player at the bottom"
    - path: screenshots/add-library.jpg
      caption: "Settings: adding a library (admin)"
  website: https://www.audiobookshelf.org
  developer: Audiobookshelf project and contributors
  license: GPL-3.0
  source_code: https://github.com/advplyr/audiobookshelf
  support: https://github.com/advplyr/audiobookshelf/issues
  docs: https://www.audiobookshelf.org/docs/
# 2.38.0, multi-arch index (linux/amd64, linux/arm64)
image: docker.io/advplyr/audiobookshelf@sha256:60064c23f32fd9099fd39e82c5132c51701d1221135bbca04cd099b589e1edc3
port: 80
health: /healthcheck
internet: true
data:
  - {path: /config, kind: config}
  - {path: /audiobooks, kind: media}
  - {path: /podcasts, kind: media}
  - /metadata
secrets:
  admin_password: {length: 24}
credentials:
  - {label: Admin Account, username: admin, password: admin_password}
sso:
  callback: /auth/openid/callback
  extra_callbacks: ['audiobookshelf://oauth']
  # Audiobookshelf maps the first of admin|user|guest found in a list claim (read from userinfo) to the
  # user type on every sign-in; YouEye ID sends this per-app claim: [admin] to its admins, [user] otherwise.
  role_claim: {claim: abs_roles, admin_value: [admin], default_value: [user]}
