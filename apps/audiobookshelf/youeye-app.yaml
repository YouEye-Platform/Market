apiVersion: v1
kind: app
integration: basic
version: "2.36.0"

metadata:
  id: "audiobookshelf"
  name: "Audiobookshelf"
  description: "Audiobook and podcast server with progress tracking"
  icon: "headphones"
  iconUrl: "icon.svg"
  category: "media"
  website: "https://www.audiobookshelf.org"
  developer: "Audiobookshelf project and contributors"
  license: "GPL-3.0"
  sourceCode: "https://github.com/advplyr/audiobookshelf"
  support: "https://github.com/advplyr/audiobookshelf/issues"
  docs: "https://www.audiobookshelf.org/docs/"
  tagline: "Your audiobooks and podcasts, on your server"
  tags: ["audiobooks", "podcasts", "media", "streaming"]
  defaultSubdomain: "audiobooks"

detail:
  releaseNotes: |
    Audiobookshelf 2.36.0 strengthens authentication and access control. It
    fixes OIDC callback validation, prevents refresh tokens from being accepted
    as API credentials, protects per-item bulk downloads, and prevents deletion
    of the root account. It also adds administrator controls for active sessions.
  longDescription: |
    Audiobookshelf is a self-hosted audiobook and podcast server. Features include per-user
    progress tracking, chapter support, bookmarks, sleep timer, playback speed control,
    and companion apps for Android and iOS. Import your audiobook collection and listen from
    anywhere.
  screenshots:
    - path: "screenshots/platform-admin-player-2.36.0.png"
      caption: "Platform administrator playing the accepted public-domain audiobook"
    - path: "screenshots/standard-user-player-2.36.0.png"
      caption: "Standard user playing the shared public-domain audiobook"

database:
  mode: none

secrets:
  - name: "admin_password"
    file: ".admin_password"
    generator: "password"
    length: 24

credentials:
  - label: "Admin Account"
    username: "admin"
    passwordSecret: "admin_password"

containers:
  - name: "main"
    type: oci
    primary: true
    image: "docker.io/advplyr/audiobookshelf@sha256:180acad33d69c99ed208676465d8edcb268fa46967735579a7810859885b1a8e"
    port: 80
    network: internet
    volumes:
      - name: config
        container: "/config"
        type: config
      - name: audiobooks
        container: "/audiobooks"
        type: media
      - name: podcasts
        container: "/podcasts"
        type: media
      - name: metadata
        container: "/metadata"
        type: data
    healthCheck:
      type: "http"
      path: "/healthcheck"
      timeout: 120000
