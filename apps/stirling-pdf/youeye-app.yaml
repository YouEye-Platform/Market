schema: youeye.app.v1
id: stirling-pdf
version: 3.5.0
name: Stirling-PDF
listing:
  tagline: A private, self-hosted toolkit for everyday PDF work
  description: All-in-one PDF toolkit for merging, splitting, and converting
  long_description: |
    Stirling-PDF is a powerful, locally-hosted PDF manipulation tool. Merge, split, rotate,
    convert, compress, and edit PDFs without uploading anything to the cloud. Supports OCR,
    watermarking, page extraction, image-to-PDF, and many more operations.

    Stirling-PDF has its own sign-in (its own accounts, and the admin password YouEye generates), so it installs
    with public access: anyone on your network can reach it, and scripts with an API key and the phone scanner
    upload work. To keep it to people with a YouEye account instead, turn public access off in the install
    dialog or later in the app's access settings.
  release_notes: |
    Stirling-PDF 3.5.0 replaces LibreOffice and Calibre with Stirling's own office
    converter inside the app. Some old formats are gone: saving as Word 97-2003 (.doc),
    reading WordPerfect, Works, Lotus, AbiWord, Hangul and XPS files, and the PostScript
    conversions. Fonts for the text editor can be added to the custom files folder.
    Accounts stay Stirling's own.

    New installs are reachable by anyone on your network, because the app has its own sign-in; on an installed
    copy, turn on public access in the app's access settings if you want that.
  category: utilities
  tags: [pdf, documents, tools, converter]
  icon: file-text
  icon_file: icon.svg
  screenshots:
    - path: screenshots/dashboard-light.png
      caption: "Workspace with every PDF tool in the side panel"
    - path: screenshots/dashboard-dark.png
      caption: "The same workspace in the dark theme"
  website: https://stirlingpdf.io
  developer: Stirling PDF Inc. and contributors
  license: MIT with upstream proprietary component carve-outs
  source_code: https://github.com/Stirling-Tools/Stirling-PDF
  support: https://github.com/Stirling-Tools/Stirling-PDF/issues
  docs: https://docs.stirlingpdf.com/
# 3.5.0, multi-arch index (linux/amd64, linux/arm64)
image: docker.io/stirlingtools/stirling-pdf@sha256:f5a38801f2dd551c26d0089ee3ea48d86a565e3adb414cb31e974bc9562cb48a
port: 8080
health: /api/v1/info/status
internet: true
data:
  - /usr/share/tessdata
  - {path: /configs, kind: config}
  - /customFiles
  - /pipeline
# Stirling-PDF only has user accounts when security/login is enabled. OIDC is free since 3.0, but the free tier
# allows 5 accounts and maps no admin role from the token (UserLicenseSettingsService, 3.3.0), and switching an
# installed app to sign-in would need a reinstall; so this install keeps local accounts behind YouEye's
# platform forward-auth gate (Plan 1, 2026-11-17). The generated bootstrap administrator
# can create independent regular users in Stirling-PDF's Admin Settings.
env:
  SECURITY_ENABLELOGIN: 'true'
  SECURITY_LOGINMETHOD: normal
  SYSTEM_DEFAULTLOCALE: ${platform.locale}
  SECURITY_INITIALLOGIN_USERNAME: admin
  SECURITY_INITIALLOGIN_PASSWORD: ${secret.admin_password}
  SECURITY_OAUTH2_ENABLED: 'false'
  SECURITY_OAUTH2_DEBUGLOGGING: 'false'
  SYSTEM_GOOGLEVISIBILITY: 'false'
  # 3.x: server-side file storage defaults on, outside the data path (files would be lost on update): keep it off.
  STORAGE_ENABLED: 'false'
  # 3.x asks the admin about analytics on first launch; answer no.
  SYSTEM_ENABLEANALYTICS: 'false'
  # 3.4+ has a first-run setup wizard. Not needed here: the admin from SECURITY_INITIALLOGIN_* is
  # created with its own password, and Stirling then marks setup done itself (InitialSecuritySetup
  # markProvisionedServerSetUp; settings.yml beats env, so SYSTEM_SETUPCOMPLETED would do nothing).
secrets:
  admin_password: {length: 24}
# Access: Stirling-PDF has its own sign-in, so it installs with public access: anyone on the household network
# (LAN/VPN) can reach it, protected by the app (owner rules 2026-11-13 and 2026-11-24, decisions.md "YouEye lives
# on the LAN; apps behave like upstream"; YE-153). YouEye ID still refuses tokens to people without access to the
# app.
public_access: true
credentials:
  - {label: Admin Account, username: admin, password: admin_password}
