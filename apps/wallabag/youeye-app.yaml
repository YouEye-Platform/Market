schema: youeye.app.v1
id: wallabag
version: 2.6.19
name: wallabag
listing:
  tagline: Save web pages now and read them later
  description: Read-it-later app to save and archive web articles
  long_description: |
    wallabag is a self-hosted read-it-later application. Save web articles for offline reading,
    organize with tags, and export to EPUB or PDF. Features browser extensions for one-click
    saving, full-text search, reading time estimates, and mobile apps.

    wallabag has its own sign-in (its own accounts, and the admin password YouEye generates), so it installs
    with public access: anyone on your network can reach it, and wallabag's phone apps, browser extensions and
    e-readers work. To keep it to people with a YouEye account instead, turn public access off in the install
    dialog or later in the app's access settings.
  release_notes: |
    wallabag 2.6.19 fixes three crashes and slowdowns: importing a Pocket HTML export no longer fails
    when an article has no date, an ePub export no longer fails on a very large article element, and
    long article lists and feeds (in the app and through the API used by the phone apps and browser
    extensions) load faster. An ePub export now also downloads the article's cover picture when
    wallabag hasn't stored it. The app now runs on PHP 8.3. Your articles, tags and settings stay as
    they are.

    New installs are reachable by anyone on your network, because the app has its own sign-in; on an installed
    copy, turn on public access in the app's access settings if you want that.
  category: productivity
  tags: [bookmarks, articles, reading, archive]
  icon: bookmark
  icon_file: icon.svg
  screenshots:
    - path: screenshots/reading-list.png
      caption: "Unread articles as cards"
    - path: screenshots/website-saved-articles.png
      caption: "Archived articles"
  website: https://wallabag.org
  developer: wallabag contributors
  license: MIT
  source_code: https://github.com/wallabag/wallabag
  support: https://github.com/wallabag/wallabag/discussions
  docs: https://doc.wallabag.org/
# 2.6.19, multi-arch index (linux/amd64, linux/arm64, linux/arm/v7)
image: docker.io/wallabag/wallabag@sha256:957dd984804462367132482c37d7bd1512cabe8a9503ec22e06efddc2872942b
port: 80
health: {path: /api/version, timeout: 180}
internet: true
data:
  - /var/www/wallabag/data
  - /var/www/wallabag/web/assets/images
# NOTE: Wallabag has NO external OIDC/SAML login in the OSS build (FOSUserBundle local
# accounts only; its OAuth2 server only ISSUES API tokens). Users keep a local Wallabag
# login (admin user "wallabag"; the image creates it with password "wallabag", and setup/install.yaml
# replaces that with the generated secret before the app has a route). Outbound email (2FA, password
# reset) goes through the platform SMTP relay. The MAILER_DSN credential values must be URL-safe.
env:
  SYMFONY__ENV__DOMAIN_NAME: ${app.url}
  SYMFONY__ENV__SERVER_NAME: Wallabag
  SYMFONY__ENV__FOSUSER_REGISTRATION: 'false'
  SYMFONY__ENV__SECRET: ${secret.secret_key}
  POPULATE_DATABASE: 'true'
secrets:
  admin_password: {length: 24}
  secret_key: {kind: key}
# Access: Wallabag has its own sign-in, so it installs with public access: anyone on the household network
# (LAN/VPN) can reach it, protected by the app (owner rules 2026-11-13 and 2026-11-24, decisions.md "YouEye lives
# on the LAN; apps behave like upstream"; YE-153). YouEye ID still refuses tokens to people without access to the
# app.
public_access: true
credentials:
  - {label: Admin Account, username: wallabag, password: admin_password}
smtp:
  env:
    SYMFONY__ENV__MAILER_DSN: smtp://${smtp.user}:${smtp.password}@${smtp.host}:${smtp.port}
    SYMFONY__ENV__FROM_EMAIL: ${smtp.from}
    SYMFONY__ENV__TWOFACTOR_SENDER: ${smtp.from}
