schema: youeye.app.v1
id: bazarr
version: 1.6.2.373.1
name: Bazarr
# Its connect files post form data (form:), which YouEye reads from 0.6.9. 0.6.20: an update writes the new
# credentials: entry into the installed record (YE-208), so updated boxes show the admin account too.
requires: { youeye: ">=0.6.20" }
listing:
  tagline: Subtitles for your movies and series, found automatically
  description: Subtitle manager for Sonarr and Radarr
  long_description: |
    Bazarr finds and downloads subtitles in the languages you choose for everything Sonarr and Radarr manage.
    It watches your library, searches the subtitle providers you enable, upgrades subtitles when better ones
    appear, and saves them next to the video files, where Jellyfin picks them up.

    Connect it to Sonarr and Radarr from their connection cards. A fresh Bazarr downloads nothing until you pick
    your languages and at least one subtitle provider in its settings (many providers need a free account of
    their own). Bazarr signs you in with its own login: user admin, with the password shown under Credentials on
    the app's page. It installs open to everyone on your home network, who see its login page. Change the
    password in Bazarr's settings (Security) if you like; YouEye keeps your change.
  release_notes: |
    Bazarr now has its own sign-in instead of YouEye's access gate: user admin, with the
    password shown under Credentials on the app's page (it is also Bazarr's API key). You
    can change it in Bazarr's settings (Security); YouEye keeps your change. Apps
    connected to Bazarr keep working through its API key. Your settings, languages and
    subtitles are kept. To let everyone on your home network open it, turn on public
    access in the app's access settings. Same Bazarr 1.6.2 (LinuxServer ls373).
  category: media
  tags: [media, subtitles, tv, movies, arr, automation]
  icon: captions
  icon_file: icon.svg
  screenshots:
    - path: screenshots/bazarr-screenshot.png
      caption: "Series view with missing and downloaded subtitles per episode"
    - path: screenshots/languages-profiles.png
      caption: "Settings: a language profile"
  website: https://www.bazarr.media
  developer: morpheus65535 and Bazarr contributors
  license: GPL-3.0-only
  source_code: https://github.com/morpheus65535/bazarr
  support: https://github.com/morpheus65535/bazarr/issues
  docs: https://wiki.bazarr.media
# v1.6.2-ls373, multi-arch index (linux/amd64, linux/arm64)
image: docker.io/linuxserver/bazarr@sha256:e0c5d45965242830c5eeddaafe9ae2b5e8ca3f6c01ecda9ee9364f550921dc50
port: 6767
# Unauthenticated (bazarr/api/system/ping.py); answers once config and database are loaded.
health: /api/system/ping
internet: true
data:
  - {path: /config, kind: config}
  - {path: /custom-cont-init.d, kind: config}
# The same shared root as Sonarr, Radarr, qBittorrent and Jellyfin: Bazarr gets /data/media/... paths from Sonarr and
# Radarr and writes .srt files next to the videos, so no path mappings are needed.
shared:
  media: /data
env:
  PUID: '0'
  PGID: '0'
  TZ: Etc/UTC
secrets:
  # Bazarr's own key format (32 hex characters); hex keeps it URL-safe.
  api_key: {kind: hex, length: 16}
# Access: Bazarr has its own login, so it uses it and is public on the household network (owner rule 2026-11-24,
# decisions.md "YouEye ID is convenience, not a gate"; YE-204). Its account is user admin with the generated api_key
# as password (no update can add a secret on boxes before 0.6.20, and the key is already generated on every box).
# Bazarr's API always accepts the API key whatever auth.type is (bazarr/api/utils.py authenticate), so the connect
# files keep working, and /api/system/ping (the health route) needs no sign-in.
public_access: true
credentials:
  - {label: Admin Account, username: admin, password: api_key}
# Bazarr keeps every setting in /config/config/config.yaml and rewrites it on each save, so a files: template for it
# would wipe the user's settings on every update. Instead this per-start script edits only the keys YouEye owns:
# the API key, the bind address, a login (auth.type form unless the household picked form or basic), and once (the
# marker file) the account admin with the password stored as upstream stores it: unsalted MD5 hex
# (bazarr/app/config.py settings-auth-password, utilities/helper.py check_credentials). A password or user the
# household changes later in Bazarr's settings is kept.
files:
  - path: /custom-cont-init.d/10-youeye-bazarr
    mode: '0700'
    template: |
      #!/usr/bin/with-contenv bash
      set -euo pipefail
      install -d -m 0775 /data/media/tv /data/media/movies
      install -d /config/config
      # PyYAML is vendored in Bazarr's libs folder, not installed in the image's Python (live test, 1.6.2).
      YOUEYE_API_KEY='${secret.api_key}' PYTHONPATH=/app/bazarr/bin/libs python3 - <<'PY'
      import hashlib, os, yaml
      p = '/config/config/config.yaml'
      marker = '/config/.youeye-admin-ready'
      key = os.environ['YOUEYE_API_KEY']
      c = (yaml.safe_load(open(p)) if os.path.exists(p) else None) or {}
      auth = c.setdefault('auth', {})
      auth['apikey'] = key
      if auth.get('type') not in ('form', 'basic'):
          auth['type'] = 'form'
      first = not os.path.exists(marker)
      if first:
          auth['username'] = 'admin'
          auth['password'] = hashlib.md5(key.encode()).hexdigest()
      g = c.setdefault('general', {})
      g['ip'] = '*'
      g['port'] = 6767
      g['base_url'] = ''
      with open(p + '.tmp', 'w') as f:
          yaml.safe_dump(c, f, default_flow_style=False)
      os.replace(p + '.tmp', p)
      if first:
          open(marker, 'w').close()
      PY
provides:
  - {type: subtitles, description: Subtitle manager (Bazarr), port: 6767, scope: service}
connects:
  - app: sonarr
    name: Sonarr
    description: Fetch subtitles for your TV series
    scope: service
    setup: setup/connect-sonarr.yaml
  - app: radarr
    name: Radarr
    description: Fetch subtitles for your movies
    scope: service
    setup: setup/connect-radarr.yaml
api_key: {secret: api_key}
