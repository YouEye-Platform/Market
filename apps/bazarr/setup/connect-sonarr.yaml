# Bazarr's settings API (bazarr/api/system/settings.py, 1.6.2) takes form data only. form: encodes every value, so
# the Sonarr API key (base64, may contain '+') arrives intact. It sets the same keys every time, so a re-run is
# harmless.
schema: youeye.setup.v1
for: connect:sonarr
steps:
  - wait: {http: /api/system/ping, timeout: 180}
  - http:
      method: POST
      path: /api/system/settings
      headers: {X-API-KEY: '${self.api_key}'}
      form:
        settings-general-use_sonarr: 'true'
        settings-sonarr-ip: '${peer.host}'
        settings-sonarr-port: '8989'
        settings-sonarr-base_url: /
        settings-sonarr-ssl: 'false'
        settings-sonarr-apikey: '${peer.api_key}'
remove:
  - http:
      method: POST
      path: /api/system/settings
      headers: {X-API-KEY: '${self.api_key}'}
      form:
        settings-general-use_sonarr: 'false'
