apiVersion: v1
kind: app
integration: basic
version: "10.11.11"

metadata:
  id: "jellyfin"
  name: "Jellyfin"
  description: "Free and open-source media streaming server"
  icon: "film"
  iconUrl: "icon.svg"
  category: "media"
  website: "https://jellyfin.org"
  developer: "Jellyfin Project"
  license: "GPL-2.0"
  sourceCode: "https://github.com/jellyfin/jellyfin"
  support: "https://forum.jellyfin.org"
  docs: "https://jellyfin.org/docs"
  tagline: "The free software media system"
  tags: ["media", "streaming", "movies", "music", "tv", "video"]
  defaultSubdomain: "jellyfin"

detail:
  releaseNotes: |
    Jellyfin 10.11.11 is the current stable server release. It adds a locking
    helper to UserManager as a focused reliability fix on the maintained 10.11
    line. This fresh-install definition uses the exact upstream release and
    immutable official container index published on 6 June 2026.
  longDescription: |
    Jellyfin is the free software media system that puts you in control of managing and
    streaming your media. Stream movies, TV shows, music, and photos to any device from
    your own server with no strings attached. No premium licenses, no tracking, fully
    open source. Supports hardware-accelerated transcoding, live TV & DVR, and a rich
    ecosystem of clients for every platform.
  screenshots:
    - path: "screenshots/platform-admin-player-10.11.11.png"
      caption: "Platform administrator streaming the accepted public-domain movie"
    - path: "screenshots/standard-user-player-10.11.11.png"
      caption: "Standard user streaming the same shared public-domain movie"

database:
  mode: none

secrets:
  - name: "admin_password"
    file: ".admin_password"
    generator: "password"
    length: 24

credentials:
  - label: "Admin Account"
    username: "admin"
    passwordSecret: "admin_password"

containers:
  - name: "main"
    type: oci
    primary: true
    image: "docker.io/jellyfin/jellyfin@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db"
    port: 8096
    network: internet
    volumes:
      - name: config
        container: "/config"
        type: data
      - name: cache
        container: "/cache"
        type: cache
      - name: data
        container: "/data"
        type: media
        storageGroup: media   # shared with Sonarr/Radarr/qBittorrent — Jellyfin scans /data/media/{movies,tv} for finished downloads
    healthCheck:
      type: "http"
      path: "/health"
      timeout: 240000

env_mapping:
  JELLYFIN_PublishedServerUrl: "${app.url}"
