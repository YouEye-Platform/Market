schema: youeye.setup.v1
for: sso
# The admin account is created by setup/install.yaml; this file installs the SSO plugin and configures it.
steps:
  - http:
      method: POST
      path: /Users/AuthenticateByName
      headers:
        Authorization: MediaBrowser Client="YouEye", Device="Server", DeviceId="youeye-setup", Version="1.0.0"
      body:
        Username: YouEye Admin
        Pw: ${secret.admin_password}
      save: {jellyfinToken: AccessToken}
  - http:
      method: GET
      path: /Repositories
      headers:
        Authorization: MediaBrowser Token="${vars.jellyfinToken}"
      save: {currentRepos: $}
  - http:
      method: POST
      path: /Repositories
      headers:
        Authorization: MediaBrowser Token="${vars.jellyfinToken}"
      body:
        - Name: Jellyfin Stable
          Url: https://repo.jellyfin.org/files/plugin/manifest.json
          Enabled: true
        # The 9p4 plugin was archived on 2026-05-12 (last build for 10.11). MaxRink's fork keeps its GUID, routes and
        # config fields and builds for ABI 12.0.0.0; the version is pinned in the install step below.
        - Name: SSO-Auth
          Url: https://raw.githubusercontent.com/MaxRink/jellyfin-plugin-sso/manifest-release/manifest.json
          Enabled: true
  - http:
      method: POST
      # Pinned: SSO-Auth 6.1.0.0 (targetAbi 12.0.0.0, zip MD5 297c1d7eb6d9c324a4337f8f567ad3d8, which Jellyfin checks).
      path: /Packages/Installed/SSO-Auth?assemblyGuid=505ce9d1-d916-42fa-86ca-673ef241d7df&version=6.1.0.0&repositoryUrl=https%3A%2F%2Fraw.githubusercontent.com%2FMaxRink%2Fjellyfin-plugin-sso%2Fmanifest-release%2Fmanifest.json
      headers:
        Authorization: MediaBrowser Token="${vars.jellyfinToken}"
  - http:
      method: POST
      path: /System/Restart
      headers:
        Authorization: MediaBrowser Token="${vars.jellyfinToken}"
      allow_failure: true
  - sleep: 15
  - http:
      method: POST
      path: /Users/AuthenticateByName
      headers:
        Authorization: MediaBrowser Client="YouEye", Device="Server", DeviceId="youeye-setup", Version="1.0.0"
      body:
        Username: YouEye Admin
        Pw: ${secret.admin_password}
      save: {jellyfinToken: AccessToken}
  - http:
      method: GET
      path: /sso/OID/Del/${sso.slug}
      headers:
        Authorization: MediaBrowser Client="YouEye", Device="Server", DeviceId="youeye-setup", Version="1.0.0", Token="${vars.jellyfinToken}"
      allow_failure: true
  - http:
      method: POST
      path: /sso/OID/Add/${sso.slug}
      headers:
        Authorization: MediaBrowser Client="YouEye", Device="Server", DeviceId="youeye-setup", Version="1.0.0", Token="${vars.jellyfinToken}"
      body:
        oidEndpoint: ${sso.issuer}
        oidClientId: ${sso.client_id}
        oidSecret: ${sso.client_secret}
        enabled: true
        enableAuthorization: true
        enableAllFolders: true
        enabledFolders: []
        adminRoles: [admin]
        roles: []
        enableFolderRoles: false
        folderRoleMapping: []
        enableLiveTvRoles: false
        liveTvRoles: []
        liveTvManagementRoles: []
        enableLiveTv: false
        enableLiveTvManagement: false
        roleClaim: groups
        oidScopes: [openid, email, profile]
        defaultProvider: ''
        defaultUsernameClaim: preferred_username
        # Split-channel OIDC over an internal HTTP back-channel. The OIDC discovery
        # document (issuer/token/userinfo/jwks) is served on the internal app-gateway
        # http://<gw>:3002 (no internal TLS), while the authorization_endpoint is on the
        # external browser host https://id.<domain>. The Jellyfin SSO plugin uses Duende
        # IdentityModel, which (a) requires HTTPS for the discovery fetch and (b) validates
        # that every endpoint shares the issuer host. Both reject this split-channel setup,
        # so the OIDC client throws while loading discovery and /sso/OID/start returns 500.
        # All three flags are required and safe here: the issuer is a trusted first-party
        # YouEye ID provider on the isolated internal network; token signature/audience/
        # expiry validation is unaffected.
        # allow the http://<gw>:3002 discovery fetch (else "HTTPS required")
        disableHttps: true
        # authorize host (id.<domain>) != issuer host (<gw>:3002)
        doNotValidateEndpoints: true
        # issuer name differs from the external browser host
        doNotValidateIssuerName: true
        doNotLoadProfile: false
        schemeOverride: https
remove:
  - http:
      method: POST
      path: /Users/AuthenticateByName
      headers:
        Authorization: MediaBrowser Client="YouEye", Device="Server", DeviceId="youeye-setup", Version="1.0.0"
      body:
        Username: YouEye Admin
        Pw: ${secret.admin_password}
      save: {jellyfinToken: AccessToken}
  - http:
      method: GET
      path: /sso/OID/Del/${sso.slug}
      headers:
        Authorization: MediaBrowser Client="YouEye", Device="Server", DeviceId="youeye-setup", Version="1.0.0", Token="${vars.jellyfinToken}"
