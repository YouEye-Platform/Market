schema: youeye.app.v1
id: miniflux
version: 2.3.5
name: Miniflux
listing:
  tagline: A fast, focused feed reader without distractions
  description: Minimalist and opinionated RSS reader
  long_description: |
    Miniflux is a minimalist and opinionated feed reader. Built with Go, it's fast,
    lightweight, and focused on simplicity. Features include keyboard shortcuts, automatic
    HTTPS detection, content scraping for truncated feeds, legacy reader API compatibility,
    integration with read-it-later services, and a clean dark mode.

    Sign-in: everyone signs in with YouEye ID. Members of YouEye ID's admin group are Miniflux admins;
    everyone else is a regular user. The setup account shown under Credentials stays as a recovery admin.
  release_notes: |
    Miniflux 2.3.5 gives YouEye ID admins Miniflux admin rights at every sign-in (and
    takes them away when they leave the admin group). Sign-in settings have their own
    page, changing a password needs the current one, and the protection against feeds
    pointing at private addresses is stricter.
  category: productivity
  tags: [rss, news, feeds, minimalist]
  icon: rss
  icon_file: icon.svg
  screenshots:
    - path: screenshots/overview-default-theme.png
      caption: "Unread entries list"
    - path: screenshots/miniflux-feeds.png
      caption: "Feed list with unread counts"
  website: https://miniflux.app
  developer: Frédéric Guillot and contributors
  license: Apache-2.0
  source_code: https://github.com/miniflux/v2
  support: https://github.com/miniflux/v2/issues
  docs: https://miniflux.app/docs/
# 2.3.5, multi-arch index (linux/amd64, linux/arm, linux/arm64, linux/riscv64)
image: docker.io/miniflux/miniflux@sha256:8fd6c3c434ecc3d4083306f83e03c0bb74c632e0f8378da5ead7e1773b0b89c9
port: 8080
health: /healthcheck
internet: true
database: postgres
env:
  DATABASE_URL: ${database.url}?sslmode=disable
  RUN_MIGRATIONS: '1'
  CREATE_ADMIN: '1'
  ADMIN_USERNAME: admin
  ADMIN_PASSWORD: ${secret.admin_password}
  BASE_URL: ${app.url}
secrets:
  admin_password: {length: 24}
credentials:
  - {label: Admin Account, username: admin, password: admin_password}
sso:
  callback: /oauth2/oidc/callback
  env:
    OAUTH2_PROVIDER: oidc
    OAUTH2_CLIENT_ID: ${sso.client_id}
    OAUTH2_CLIENT_SECRET: ${sso.client_secret}
    OAUTH2_REDIRECT_URL: ${app.url}/oauth2/oidc/callback
    # Miniflux passes this value to go-oidc NewProvider(), which expects an
    # issuer and performs discovery itself despite the environment key's name.
    OAUTH2_OIDC_DISCOVERY_ENDPOINT: ${sso.issuer}
    OAUTH2_USER_CREATION: '1'
    # 2.3.5+: admin follows YouEye ID's admin group at every sign-in (granted and taken away).
    OAUTH2_ADDITIONAL_SCOPES: groups
    OAUTH2_GROUP_CLAIM: groups
    OAUTH2_ADMIN_GROUP: admin
