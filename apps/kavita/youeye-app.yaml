schema: youeye.app.v1
id: kavita
version: 0.9.0.2
name: Kavita
listing:
  tagline: Your digital reading library, on every device
  description: Reading server for manga, comics, and ebooks
  long_description: |
    Kavita is a fast, feature-rich, cross-platform reading server. Supports manga, comics,
    and ebooks in multiple formats (CBZ, CBR, ZIP, EPUB, PDF). Features include reading
    progress tracking, library management, metadata handling, OPDS support, and a responsive
    web reader for personal reading libraries.
  release_notes: |
    Kavita 0.9.0.2 is a critical security hotfix for CVE-2026-47202,
    which affects every earlier release. It also strengthens OpenID Connect
    validation and includes the fixes delivered throughout the 0.9 release.
  category: media
  tags: [reading, manga, comics, ebooks, library]
  icon: book-open
  icon_file: icon.svg
  screenshots:
    - path: screenshots/platform-admin-reader-0.9.0.2.png
      caption: Platform administrator reading the accepted public-domain ebook
    - path: screenshots/standard-user-reader-0.9.0.2.png
      caption: Standard user reading the shared public-domain library
  website: https://www.kavitareader.com
  developer: Kavita project and contributors
  license: GPL-3.0
  source_code: https://github.com/Kareadita/Kavita
  support: https://github.com/Kareadita/Kavita/issues
  docs: https://wiki.kavitareader.com
image: docker.io/library/caddy@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
port: 5000
health: {path: /api/health, timeout: 180}
internet: true
data:
  - {path: /etc/caddy, kind: config}
# Kavita reads its OIDC authority, client and secret from config/appsettings.json at startup (the
# entrypoint writes them from env); the rest of its OIDC behaviour is set through its settings API
# (setup/install.yaml). Its .NET client needs HTTPS metadata and endpoints, so the authority is YouEye ID's
# public per-app address: fetched there, the discovery document lists public endpoints and the app's own
# issuer (which its tokens carry). Kavita's settings API would refuse this authority (it requires
# issuer == authority), which is why it is written to appsettings.json. The app's own public address
# cannot serve the metadata: every app route is behind YouEye's access gate. The main container is a
# Caddy front that proxies every request to Kavita, so the install health check also proves that path.
env:
  YOUEYE_KAVITA_HOST: ${sidecar.kavita.host}
secrets:
  admin_password: {length: 24}
credentials:
  - {label: Admin Account, username: admin, password: admin_password}
files:
  - path: /etc/caddy/Caddyfile
    mode: '0600'
    template: |
      {
        admin off
        auto_https off
      }

      :5000 {
        reverse_proxy {$YOUEYE_KAVITA_HOST}:5000
      }
  - container: kavita
    path: /kavita/config/youeye-entrypoint.sh
    mode: '0700'
    template: |
      #!/bin/bash
      set -euo pipefail

      settings=/kavita/config/appsettings.json
      if [ ! -f "$settings" ]; then
        cp /tmp/config/appsettings.json "$settings"
      fi

      perl -e '
        sub json_quote {
          my $value = shift // "";
          $value =~ s/\\/\\\\/g;
          $value =~ s/"/\\"/g;
          $value =~ s/\x08/\\b/g;
          $value =~ s/\x0c/\\f/g;
          $value =~ s/\n/\\n/g;
          $value =~ s/\r/\\r/g;
          $value =~ s/\t/\\t/g;
          $value =~ s/([\x00-\x07\x0b\x0e-\x1f])/sprintf("\\u%04x", ord($1))/eg;
          return "\"$value\"";
        }
        my $path = shift;
        local $/;
        open my $input, "<", $path or die "unable to read appsettings";
        my $settings = <$input>;
        close $input;
        $settings =~ s/,\s*"OpenIdConnectSettings"\s*:\s*\{.*?\}\s*(?=\})//s;
        $settings =~ s/\s*\}\s*$// or die "invalid appsettings";
        $settings .= ",\n  \"OpenIdConnectSettings\": {\n";
        $settings .= "    \"Authority\": " . json_quote($ENV{YOUEYE_OIDC_CLIENT_ID} ? $ENV{YOUEYE_OIDC_AUTHORITY} : "") . ",\n";
        $settings .= "    \"ClientId\": " . json_quote($ENV{YOUEYE_OIDC_CLIENT_ID}) . ",\n";
        $settings .= "    \"Secret\": " . json_quote($ENV{YOUEYE_OIDC_CLIENT_SECRET}) . ",\n";
        $settings .= "    \"CustomScopes\": []\n  }\n}\n";
        my $temporary = "$path.tmp";
        open my $output, ">", $temporary or die "unable to write appsettings";
        print {$output} $settings;
        close $output;
        rename $temporary, $path or die "unable to replace appsettings";
      ' "$settings"
      chmod 600 "$settings"

      bootstrap_admin() {
        local attempt=0
        while [ "$attempt" -lt 120 ]; do
          if curl --fail --silent --output /dev/null http://127.0.0.1:5000/api/health; then
            local payload
            local status
            payload=$(mktemp)
            chmod 600 "$payload"
            perl -e '
              sub json_quote {
                my $value = shift // "";
                $value =~ s/\\/\\\\/g;
                $value =~ s/"/\\"/g;
                $value =~ s/\x08/\\b/g;
                $value =~ s/\x0c/\\f/g;
                $value =~ s/\n/\\n/g;
                $value =~ s/\r/\\r/g;
                $value =~ s/\t/\\t/g;
                $value =~ s/([\x00-\x07\x0b\x0e-\x1f])/sprintf("\\u%04x", ord($1))/eg;
                return "\"$value\"";
              }
              print "{\"username\":\"admin\",\"email\":\"admin@example.invalid\",\"password\":";
              print json_quote($ENV{YOUEYE_ADMIN_PASSWORD});
              print "}";
            ' > "$payload"
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --header 'Content-Type: application/json' --data-binary @"$payload" \
              http://127.0.0.1:5000/api/Account/register || true)
            rm -f "$payload"
            if [ "$status" = "200" ] || [ "$status" = "400" ]; then
              return 0
            fi
          fi
          attempt=$((attempt + 1))
          sleep 1
        done
        return 1
      }

      bootstrap_admin &
      exec ./Kavita
sso:
  callback: /signin-oidc
sidecars:
  # Kavita itself runs behind the main Caddy gateway. Its entrypoint writes the OIDC values from its env
  # and creates the first (admin) account.
  - name: kavita
    image: docker.io/jvmilazz0/kavita@sha256:ca6af7a18d7124d014702983c2364e485294f808c1552e9555f2595b7cda7982
    port: 5000
    data:
      - {path: /kavita/config, kind: config}
      - {path: /manga, kind: media}
    command: [/bin/bash, /kavita/config/youeye-entrypoint.sh]
    health: /api/health
    env:
      YOUEYE_ADMIN_PASSWORD: ${secret.admin_password}
      YOUEYE_OIDC_AUTHORITY: ${identity.external_url}/application/o/${sso.slug}/
      YOUEYE_OIDC_CLIENT_ID: ${sso.client_id}
      YOUEYE_OIDC_CLIENT_SECRET: ${sso.client_secret}
