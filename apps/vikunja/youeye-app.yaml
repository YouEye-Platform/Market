schema: youeye.app.v1
id: vikunja
version: 2.8.0
name: Vikunja
listing:
  tagline: The flexible task manager you control
  description: Full-featured task manager with lists, kanban, and gantt
  long_description: |
    Vikunja is an open-source, self-hosted to-do app. Organize tasks with lists, kanban boards,
    gantt charts, and table views. Features include labels, priorities, due dates, reminders,
    assignees, comments, attachments, and CalDAV sync. Supports team collaboration with
    shared projects.

    Sign-in: everyone signs in with YouEye ID as a regular Vikunja user; Vikunja cannot take roles from
    YouEye ID. Instance admin (the admin panel) is a paid licence feature of Vikunja, so this install has none;
    whoever creates a project owns it and shares it with others.

    Vikunja has its own sign-in (YouEye ID), so it installs with public access: anyone on your network can reach
    it, and calendar apps (CalDAV) and Vikunja's apps with a token work. To keep it to people with a YouEye
    account instead, turn public access off in the install dialog or later in the app's access settings.
  release_notes: |
    Vikunja 2.8.0 fixes 19 security issues and adds a trash bin (deleted projects and
    tasks are kept for 30 days) and an account lockout after repeated failed sign-ins.
    2.6 and 2.7 brought many fixes to task views, reminders and sharing. A few features
    of the optional paid Vikunja licence (admin panel, time tracking, audit logs, user
    invites) stay off; everything else is free as before.

    New installs are reachable by anyone on your network, because the app has its own sign-in; on an installed
    copy, turn on public access in the app's access settings if you want that.
  category: productivity
  tags: [tasks, todo, kanban, project-management]
  icon: check-square
  icon_file: icon.svg
  screenshots:
    - path: screenshots/overview-dashboard.png
      caption: "Overview with current tasks and recent projects"
    - path: screenshots/kanban-board.png
      caption: "Project as a Kanban board"
  website: https://vikunja.io
  developer: Vikunja team and contributors
  license: AGPL-3.0
  source_code: https://github.com/go-vikunja/vikunja
  support: https://community.vikunja.io/
  docs: https://vikunja.io/docs/
# 2.8.0, multi-arch index (linux/amd64, linux/arm, linux/arm64)
image: docker.io/vikunja/vikunja@sha256:35d937baf3b5d5803bed6b9e11d007448b7b536df9e4346dc35551e1072636c3
port: 3456
health: /api/v1/info
internet: true
data:
  - /app/vikunja/files
  - /db
env:
  VIKUNJA_SERVICE_PUBLICURL: ${app.url}
  VIKUNJA_SERVICE_TIMEZONE: ${platform.timezone}
  # No local sign-up (the /register route is not registered); YouEye ID still creates accounts.
  VIKUNJA_SERVICE_ENABLEREGISTRATION: 'false'
# Access: Vikunja has its own sign-in, so it installs with public access: anyone on the household network
# (LAN/VPN) can reach it, protected by the app (owner rules 2026-11-13 and 2026-11-24, decisions.md "YouEye lives
# on the LAN; apps behave like upstream"; YE-153). YouEye ID still refuses tokens to people without access to the
# app.
public_access: true
sso:
  callback: /auth/openid/authentik
  env:
    VIKUNJA_AUTH_OPENID_ENABLED: 'true'
    # Everyone signs in with YouEye ID: no local passwords.
    VIKUNJA_AUTH_LOCAL_ENABLED: 'false'
    VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHENTIK_NAME: ${identity.name}
    # Vikunja passes authurl to go-oidc NewProvider(), so despite its name this
    # must be the issuer. Discovery returns the public browser authorization URL
    # and internal server-side token/userinfo endpoints.
    VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHENTIK_AUTHURL: ${sso.issuer}
    VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHENTIK_CLIENTID: ${sso.client_id}
    VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHENTIK_CLIENTSECRET: ${sso.client_secret}
smtp:
  env:
    VIKUNJA_MAILER_ENABLED: 'true'
    VIKUNJA_MAILER_HOST: ${smtp.host}
    VIKUNJA_MAILER_PORT: ${smtp.port}
    VIKUNJA_MAILER_USERNAME: ${smtp.user}
    VIKUNJA_MAILER_PASSWORD: ${smtp.password}
    VIKUNJA_MAILER_FROMEMAIL: ${smtp.from}
