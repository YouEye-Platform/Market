# Market index. Apps are discovered from apps/<id>/youeye-app.yaml, bundles from
# bundles/<id>/bundle.yaml and system apps from system/<id>.yaml; only what cannot be discovered
# is written here.
schema: youeye.catalog.v1

# Category pills, section headers, ordering and fallback tile colours (`icon` is a Lucide name).
categories:
  - id: productivity
    label: Productivity
    icon: briefcase
    order: 1
    tile: {bg: '#eff6ff', fg: '#2563eb'}
  - id: media
    label: Media
    icon: clapperboard
    order: 2
    tile: {bg: '#fdf2f8', fg: '#db2777'}
  - id: search
    label: Search
    icon: search
    order: 3
    tile: {bg: '#f5f3ff', fg: '#7c3aed'}
  - id: social
    label: Social
    icon: users
    order: 4
    tile: {bg: '#ecfeff', fg: '#0891b2'}
  - id: utilities
    label: Utilities
    icon: wrench
    order: 5
    tile: {bg: '#f0f9ff', fg: '#0284c7'}
  - id: downloaders
    label: Downloaders
    icon: download
    order: 6
    tile: {bg: '#fff7ed', fg: '#ea580c'}
  - id: ai
    label: AI
    icon: bot
    order: 7
    tile: {bg: '#eef2ff', fg: '#4f46e5'}
  - id: other
    label: Other
    icon: package
    order: 99
    tile: {bg: '#f4f4f5', fg: '#52525b'}

# Editorial layout of the Market home: the "Built for your server" strip and labelled rows.
# Apps shown here are not repeated in the category browse.
curation:
  spotlight:
    title: Built for your server
    apps: [wiki, search, notes, cinema, weather, translate]
  collections:
    - id: private-search
      label: Private search
      apps: [searxng, wikiless]
    - id: media-and-files
      label: Media & files
      apps: [jellyfin, immich, nextcloud]

# Native apps are named by id only; the box finds each one's release through its channel index.
native: [notes, wiki, search, translate, weather, cinema]
